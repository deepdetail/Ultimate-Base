<title>BASED Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone game. Glass HUD on top, scrolling cutaway base in the middle (tower in a painted anime landscape, surface with turrets, bunker below), icon nav at the bottom. Missions and the vehicle showroom open 3D layers. */
:root{
  --gm-950:#14171B; --gm-900:#1E2227; --gm-800:#2B3036; --gm-700:#3A4149; --gm-600:#4A525C;
  --steel:#8A939E; --steel-hi:#C9D1D9;
  --teal:#2EC4C9; --teal-hi:#7FF0F3; --teal-dim:rgba(46,196,201,.16);
  --text:#F4F7FA; --muted:#A9B3BE;
  --blue:#3A8DDE; --ok:#3DDC97; --warn:#FFC845; --bad:#FF4D5E; --clone:#5BE36B;
  --lamp:#FFE7B0;
  --glass:rgba(24,28,33,.78); --glass-line:rgba(201,209,217,.18);
  --font-display:'Orbitron','Arial Black',system-ui,sans-serif;
  --font-body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--gm-950);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.metal{background:linear-gradient(135deg,var(--gm-600) 0%,var(--gm-700) 42%,var(--gm-800) 100%);position:relative;overflow:hidden}
.metal::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(201,209,217,.14) 44%,transparent 58%);pointer-events:none}
.btn{border:1px solid rgba(201,209,217,.22);border-radius:10px;padding:10px 14px;font-weight:700;letter-spacing:.04em;background:linear-gradient(180deg,#4f5862,#2f353c);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 6px rgba(0,0,0,.25);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:linear-gradient(180deg,#4fe0e4,#1c979c);color:#04282a;border-color:#8ff4f6}
.btn.danger{background:linear-gradient(180deg,#ff7682,#c42c3c);color:#fff;border-color:#ffa3ac}
.btn:disabled{opacity:.4;cursor:not-allowed}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}

/* ---------- Setup screen ---------- */
#setup{height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;background:radial-gradient(120% 60% at 50% 0%,#2a3b44 0%,var(--gm-950) 70%)}
.setup-inner{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--font-display);font-weight:800;font-size:56px;letter-spacing:.14em;text-align:center;background:linear-gradient(180deg,#fff 0%,var(--steel-hi) 45%,var(--steel) 55%,#e6edf3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(46,196,201,.45));line-height:1}
.tagline{text-align:center;color:var(--teal);letter-spacing:.3em;font-size:12px;text-transform:uppercase;margin-top:-8px}
.card{border-radius:14px;border:1px solid var(--glass-line);padding:14px;display:flex;flex-direction:column;gap:10px}
.cmd-row{display:flex;gap:14px;align-items:center}
.portrait{width:70px;height:150px;flex:none;position:relative;border-radius:12px;background:radial-gradient(circle at 50% 80%,rgba(255,231,176,.22),transparent 70%)}
.portrait .person{position:absolute;left:5px;top:0;bottom:auto;width:60px;height:150px;animation:none;pointer-events:none}
input[type=text]{width:100%;background:var(--gm-950);border:1px solid var(--gm-600);border-radius:8px;padding:10px;color:var(--text);font:600 16px var(--font-body)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--gm-900),0 0 10px var(--teal)}
.factions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fac{text-align:left;border-radius:12px;border:1px solid var(--glass-line);padding:10px;display:flex;flex-direction:column;gap:4px;min-height:112px;background:var(--gm-800)}
.fac b{font-family:var(--font-display);font-size:11px;letter-spacing:.06em}
.fac span{font-size:12px;color:var(--muted)}
.fac.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal),0 0 16px rgba(46,196,201,.25)}
.fac.locked{opacity:.45;cursor:not-allowed}
.fac .biome{font-size:22px}

/* ---------- Game shell ---------- */
#game{height:100%;display:flex;flex-direction:column}
#hud{flex:none;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;z-index:20;background:linear-gradient(180deg,rgba(40,45,52,.98),rgba(26,30,35,.96));border-bottom:1px solid var(--glass-line);box-shadow:0 1px 0 rgba(46,196,201,.35),0 6px 18px rgba(0,0,0,.35)}
.hud-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;overflow:hidden;border:2px solid var(--teal);background:radial-gradient(circle at 50% 30%,#4a6a78,#1e2a33);box-shadow:0 0 10px rgba(46,196,201,.4)}
.avatar svg{width:100%;height:100%;display:block}
.who{flex:1;min-width:0}
.who b{display:block;font-family:var(--font-display);font-size:13px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.xp{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:3px;overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-hi))}
.lv{flex:none;font-family:var(--font-display);font-size:11px;color:#04282a;background:var(--teal);border-radius:6px;padding:3px 7px}
.gear{background:rgba(255,255,255,.06);border:1px solid var(--glass-line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.gear .ic{width:18px;height:18px}
.res{display:grid;grid-template-columns:1.35fr repeat(4,minmax(0,1fr));gap:6px}
.chip{background:rgba(10,12,15,.55);border:1px solid rgba(201,209,217,.12);border-radius:9px;padding:4px 7px;min-width:0}
.chip .k{font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:3px}
.chip .k .ic{width:11px;height:11px;vertical-align:0}
.chip .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.cash .v{color:#b8f5c9}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .4s}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:7px;height:7px;border-radius:2px;background:rgba(255,255,255,.12)}
.pips i.on{background:var(--teal);box-shadow:0 0 6px var(--teal)}

#wrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;background:var(--gm-950)}
#world{max-width:540px;margin:0 auto;position:relative;min-height:100%;display:flex;flex-direction:column}
#bg{position:absolute;left:0;top:0;width:100%;z-index:0;pointer-events:none}
#world>.layer{position:relative;z-index:1}
#world .under{flex:1}
.pad-x{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.expand{display:flex;justify-content:center;padding-block:12px}
.expand button{background:var(--glass);border:1.5px dashed var(--teal);color:var(--teal);border-radius:10px;padding:8px 14px;font-weight:700;letter-spacing:.06em}
.tower,.bunker{padding:5px;display:flex;flex-direction:column;gap:5px}
.tower{background:linear-gradient(90deg,#262b31,#4a525c 30%,#3a4149 70%,#1e2227);box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(201,209,217,.35);border-radius:14px 14px 0 0}
.bunker{background:rgba(12,10,9,.6);border-radius:0 0 14px 14px;box-shadow:inset 0 6px 16px rgba(0,0,0,.5)}
.floor{display:grid;grid-template-columns:20px repeat(3,minmax(0,1fr));gap:5px}
.shaft{background:linear-gradient(90deg,#101317,#2b3036,#101317);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:9px;color:var(--teal);writing-mode:vertical-rl;letter-spacing:.1em}
.slot{height:100px;border-radius:9px;min-width:0}
.slot-empty{border:1.5px dashed rgba(46,196,201,.6);background:rgba(20,23,27,.55);color:var(--teal);font-weight:700;font-size:12px;letter-spacing:.06em;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.slot-empty .ic{width:22px;height:22px}
/* each room is a small diorama with its own painted interior */
.room{position:relative;overflow:hidden;border:1px solid rgba(201,209,217,.25);border-top-color:rgba(201,209,217,.5);text-align:left;padding:0;width:100%;background:#3a4149}
.room .decor{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.room .shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(110% 70% at 50% 0%,rgba(255,231,176,.22),transparent 60%);box-shadow:inset 12px 0 12px -8px rgba(0,0,0,.55),inset -12px 0 12px -8px rgba(0,0,0,.55),inset 0 10px 10px -8px rgba(0,0,0,.55)}
.room .rh{position:absolute;left:5px;top:5px;z-index:3;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;background:rgba(16,19,23,.78);border:1px solid rgba(201,209,217,.2);border-radius:5px;padding:2px 5px;max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis}
.room .rb{display:block;font-size:9px;color:var(--teal);font-variant-numeric:tabular-nums;letter-spacing:.02em;text-transform:none;font-weight:600}
.room .rb.low{color:var(--warn)}
.room .park{position:absolute;right:4px;top:34px;display:flex;gap:1px;font-size:16px;z-index:2;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.room.hq{border-color:rgba(46,196,201,.7)}
.room .bars{position:absolute;inset:14px 0 0 0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(201,209,217,.6) 9px 11px);pointer-events:none;z-index:4}
.pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{50%{opacity:.6;transform:scale(.92)}}
.bub{animation:bubble 2.4s linear infinite}
@keyframes bubble{from{transform:translateY(0);opacity:1}to{transform:translateY(-30px);opacity:0}}

/* surface */
.surface{position:relative;height:156px;overflow:hidden}
.surface canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.door{position:absolute;left:50%;bottom:24px;width:52px;height:62px;transform:translateX(-50%);border-radius:26px 26px 0 0;border:3px solid var(--steel-hi);background:linear-gradient(90deg,var(--gm-700) 0 49%,var(--gm-950) 49% 51%,var(--gm-700) 51%);box-shadow:0 0 18px rgba(46,196,201,.45),0 6px 10px rgba(0,0,0,.3)}
.door::after{content:"";position:absolute;left:50%;top:8px;width:10px;height:4px;transform:translateX(-50%);background:var(--teal);border-radius:2px;box-shadow:0 0 8px var(--teal)}
.sign{position:absolute;left:50%;bottom:98px;transform:translateX(-50%);font-family:var(--font-display);font-size:10px;letter-spacing:.2em;color:var(--text);background:var(--glass);padding:4px 10px;border-radius:6px;border:1px solid var(--teal);white-space:nowrap}
.lobby{position:absolute;left:30%;right:30%;bottom:20px;height:60px}
.tpad{position:absolute;bottom:24px;width:38px;height:40px;transform:translateX(-50%);border:none;background:none;padding:0;z-index:4}
.tpad.empty::before{content:"+";position:absolute;inset:6px 2px 0;border:1.5px dashed var(--teal);border-radius:7px;color:var(--teal);display:grid;place-items:center;font-size:18px;background:rgba(20,23,27,.5)}
.tur .base{position:absolute;bottom:0;left:5px;width:28px;height:12px;background:linear-gradient(180deg,var(--steel),var(--gm-600));clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.tur .dome{position:absolute;bottom:10px;left:10px;width:18px;height:15px;border-radius:9px 9px 2px 2px;background:radial-gradient(circle at 35% 30%,#fff,var(--steel-hi) 25%,var(--gm-600));z-index:2}
.tur .barrel{position:absolute;bottom:18px;left:18px;width:20px;height:4px;border-radius:2px;background:var(--steel-hi);transform-origin:1px 2px;transform:rotate(var(--a,-15deg));transition:transform .12s}
.tur.net .barrel{background:var(--teal);height:6px}
.tur.laser .barrel{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.tur .stars{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:8px;color:var(--warn);z-index:3}
.enemy{position:absolute;bottom:20px;transform:translateX(-50%);z-index:5;font-size:26px;line-height:1;pointer-events:none}
.enemy .em{display:block}
.enemy.flip .em{transform:scaleX(-1)}
.enemy.big{font-size:36px}
.enemy .hpb{position:absolute;left:4px;right:4px;top:-6px;height:4px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
.enemy .hpb i{display:block;height:100%;background:var(--bad)}
.enemy.ko .hpb{display:none}
.enemy.ko::after{content:"💫";position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:16px}
.shield{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:62%;z-index:7;text-align:center}
.shield .bar{height:7px;border:1px solid rgba(255,255,255,.3)}
.shield .label{color:var(--text);font-size:10px;text-shadow:0 1px 2px #000}

/* people: slim anime ninja crew drawn in SVG */
.person{position:absolute;bottom:2px;left:var(--x,40%);width:24px;height:60px;animation:pace var(--d,4s) ease-in-out infinite alternate;z-index:2;cursor:pointer}
.person::after{content:"";position:absolute;inset:-6px -8px 0}
.person svg{width:100%;height:100%;display:block;overflow:visible;animation:bob .6s ease-in-out infinite}
@keyframes pace{from{transform:translateX(calc(var(--r,14px) * -1))}to{transform:translateX(var(--r,14px))}}
@keyframes bob{50%{transform:translateY(-1px)}}
.person .coatg{display:none}
.person.coat .coatg{display:inline}
.person.hurt,.person.jailed{animation:none}
.person.hurt svg,.person.jailed svg{animation:none}
.person.hurt{opacity:.85}
.portrait .person svg,.mini .person svg{animation:none}

/* nav */
#nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20;background:linear-gradient(0deg,rgba(26,30,35,.98),rgba(40,45,52,.96));border-top:1px solid var(--glass-line);box-shadow:0 -1px 0 rgba(46,196,201,.3)}
#nav .btn{padding:7px 4px;font-size:11px;flex-direction:column;gap:2px;border-radius:12px}
#nav .btn .ic{width:20px;height:20px}
#nav .btn small{font-size:9px;font-weight:600;opacity:.8;letter-spacing:.04em}
#nav .battle{background:linear-gradient(180deg,#ff7682,#b0283a);border-color:#ffa3ac;font-family:var(--font-display);font-size:10px;box-shadow:0 0 14px rgba(255,77,94,.35),inset 0 1px 0 rgba(255,255,255,.25)}

/* sheet + toasts */
#sheet{position:fixed;inset:0;z-index:90;background:rgba(8,10,12,.62);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:540px;max-height:86%;overflow-y:auto;border-radius:20px 20px 0 0;border:1px solid var(--glass-line);border-bottom:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out;box-shadow:0 -10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.panel::after{content:"";position:absolute;left:50%;top:6px;width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);transform:translateX(-50%)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px}
.panel-h h2{font-size:17px;letter-spacing:.06em}
.x{background:rgba(255,255,255,.06);border:1px solid var(--glass-line);border-radius:10px;width:34px;height:34px;font-size:15px;flex:none}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:1px solid var(--glass-line);border-radius:12px;padding:10px;background:linear-gradient(180deg,#323940,#262b31);display:flex;flex-direction:column;gap:3px;min-width:0}
.opt b{font-size:13px}
.opt span{font-size:11.5px;color:var(--muted)}
.opt .cost{color:#b8f5c9;font-weight:700}
.opt:disabled{opacity:.4}
.opt.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.bubble{position:relative;background:var(--text);color:var(--gm-900);border-radius:14px;padding:10px 12px;font-weight:600;font-size:14px;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-7px;top:18px;border:7px solid transparent;border-right-color:var(--text);border-left:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:rgba(10,12,15,.55);border:1px solid rgba(201,209,217,.1);border-radius:9px;padding:6px;text-align:center}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:10px;color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 100px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:linear-gradient(180deg,#323940,#262b31);border:1px solid rgba(201,209,217,.12);text-align:left;width:100%}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{font-size:11.5px;color:var(--muted)}
.mini{width:22px;height:55px;position:relative;flex:none}
.mini .person{animation:none;left:0;bottom:0;width:22px;height:55px;pointer-events:none}
.tabs{display:flex;gap:6px;background:rgba(10,12,15,.5);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:8px 4px;border-radius:9px;border:none;background:none;font-weight:700;font-size:11px;color:var(--muted)}
.tabs button.on{color:#04282a;background:var(--teal)}
.veh{font-size:30px;width:44px;text-align:center;flex:none}
.tag{font-size:10px;padding:2px 7px;border-radius:5px;background:var(--teal-dim);color:var(--teal);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.tag.bad{background:rgba(255,77,94,.15);color:var(--bad)}
.tag.ok{background:rgba(61,220,151,.15);color:var(--ok)}
.tag.dim{background:rgba(255,255,255,.08);color:var(--muted)}
.tag.gold{background:rgba(255,200,69,.15);color:var(--warn)}
.big-emoji{font-size:44px;text-align:center}
.route{display:flex;flex-direction:column;gap:4px;padding-left:4px}
.route div{display:flex;gap:8px;align-items:center;font-size:13px}
.route i{width:10px;height:10px;border-radius:50%;border:2px solid var(--teal);flex:none}
.route .fin i{background:var(--bad);border-color:var(--bad)}
.show3d{width:100%;height:230px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#3e5866,#141a20 75%);border:1px solid var(--glass-line);display:block;touch-action:none}
.phys{display:flex;gap:4px;align-items:center}
.phys i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.phys i.on{background:linear-gradient(90deg,var(--warn),#ff9f43)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 106px);z-index:95;display:flex;flex-direction:column;gap:6px;width:min(92%,480px);pointer-events:none}
.toast{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-line);border-left:4px solid var(--teal);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;animation:up .2s ease-out;box-shadow:0 6px 16px rgba(0,0,0,.35)}

function migrate(s){
  if(s.v===1){ s.res.credits=Math.round(s.res.credits*375); s.v=2; s.upg=s.upg||{};
    s.crew.forEach(c=>{c.outfit=c.outfit||'jumpsuit';c.weapon=c.weapon||(c.isCmd?'katana':'none');if(c.isCmd){c.trim=c.shirt;c.shirt='#262b31'}});
    if(!s.vehicles.includes('cyber')) s.vehicles.push('cyber'); }
  return s;
}

const biome=()=>FACTIONS[S.faction].biome;
const mapKey=()=>FACTIONS[S.faction].map;
const xpNeed=L=>30+5*L;
function levelInfo(){let L=1,x=S.xp;while(L<100&&x>=xpNeed(L)){x-=xpNeed(L);L++}return {L,into:x,need:xpNeed(L)}}
const level=()=>levelInfo().L;
// the outside of the base goes back and forth between classic and futuristic luxury as it levels up
const ERAS=[{min:1,key:'brutal',name:'Minimalist Brutalist'},{min:10,key:'futur',name:'Standard Futuristic'},{min:20,key:'vintage',name:'Vintage Mid-Century'},{min:35,key:'antique',name:'Antique Grand'},{min:50,key:'modern',name:'Ultra Modern'},{min:70,key:'luxe',name:'Luxury Futuristic'},{min:85,key:'billion',name:'Brutalist Billionaire'}];
const eraOf=L=>ERAS.filter(e=>L>=e.min).pop();
const maxFloors=()=>Math.min(10,5+Math.floor(level()/10));
const roomsOf=t=>Object.keys(S.rooms).filter(k=>S.rooms[k].type===t);
const crewIn=k=>S.crew.filter(c=>c.room===k);
// rooms can be 1 to 3 slots wide, floors 1 to 3 times taller, rooms level 1 to 5
const rW=k=>S.rooms[k].w||1,rH=k=>(S.floorH&&S.floorH[k.split(':')[0]])||1,rL=k=>S.rooms[k].lvl||1;
const sumOf=(t,f)=>roomsOf(t).reduce((s,k)=>s+f(k),0);
const roomCap=k=>ROOMS[S.rooms[k].type].cap*rW(k)+(rH(k)-1);
const vehRoom=k=>4*rW(k)+2*(rH(k)-1);
const crewCap=()=>2+sumOf('quarters',k=>4*rW(k)+2*(rH(k)-1));
const vehCap=()=>sumOf('hangar',vehRoom);
const jailCap=()=>sumOf('cell',k=>2*rW(k));
const foodMax=()=>100+sumOf('food',k=>100*rW(k));
const powMax=()=>100+sumOf('power',k=>100*rW(k));
const floorName=f=>f>0?'F'+f:'B'+(-f);
const clsOf=c=>c.isCmd?'Commander':(c.room?ROOMS[S.rooms[c.room].type].cls:'Crew');
function titleOf(c){
  if(c.isCmd) return 'Base Commander';
  const tier=Math.min(3,Math.floor(c.xp/90));
  return TIERS[clsOf(c)][tier]+' · Tier '+(tier+1);
}
function roomRate(k){
  const def=ROOMS[S.rooms[k].type]; if(!def.prod) return 0;
  const powOk=def.prod==='power'||S.res.power>0;
  return crewIn(k).filter(c=>!c.hurt).reduce((s,c)=>s+def.rate*(1+eff(c,def.stat)/10)*(.5+c.mood/200)*(c.clone?.5:1)*(powOk?1:.5),0)*(1+.25*(rL(k)-1))*(1+.2*(rH(k)-1));
}

// ---------- painted anime backdrop ----------
function cloud(g,cx,cy,s,shadeC){
  const r=seeded(Math.floor(Math.abs(cx)*7+cy*13)+1);
  const puffs=[];for(let i=0;i<7;i++){const t=i/6;puffs.push([cx+(t-.5)*s*1.9,cy-Math.sin(t*Math.PI)*s*(.45+r()*.25),s*(.28+r()*.22)])}
  puffs.push([cx,cy-s*.15,s*.45]);
  g.fillStyle=shadeC; puffs.forEach(([x,y,rr])=>{g.beginPath();g.arc(x+s*.04,y+s*.1,rr,0,7);g.fill()});
  g.fillStyle='#ffffff'; puffs.forEach(([x,y,rr])=>{g.beginPath();g.arc(x,y,rr,0,7);g.fill()});
  g.fillStyle=shadeC; g.globalAlpha=.55; g.beginPath(); g.ellipse(cx,cy+s*.08,s*.95,s*.12,0,0,7); g.fill(); g.globalAlpha=1;
}
function ridge(g,W,base,amp,seed,color,snow){
  const r=seeded(seed);const ph=[r()*6,r()*6,r()*6];const pts=[];
  for(let x=-10;x<=W+10;x+=6){const y=base-amp*(.55+.25*Math.sin(x/W*3.1+ph[0])+.15*Math.sin(x/W*7.3+ph[1])+.08*Math.sin(x/W*17+ph[2]));pts.push([x,y])}
  g.fillStyle=color;g.beginPath();g.moveTo(-10,base+400);pts.forEach(([x,y])=>g.lineTo(x,y));g.lineTo(W+10,base+400);g.fill();
  if(snow){g.fillStyle=snow;g.beginPath();let on=false;
    for(let i=1;i<pts.length-1;i++){const [x,y]=pts[i];if(y<base-amp*.78&&pts[i-1][1]>=y&&pts[i+1][1]>=y){g.moveTo(x-16,y+12);g.quadraticCurveTo(x,y-3,x+16,y+12);g.lineTo(x+8,y+9);g.lineTo(x,y+14);g.lineTo(x-8,y+9);g.closePath();on=true}}
    if(on) g.fill()}
}
function pine(g,x,y,h,dark,lite){
  const w=h*.42;
  for(let i=0;i<4;i++){const ty=y-h*(i*.22),tw=w*(1-i*.2),th=h*.42;
    g.fillStyle=dark;g.beginPath();g.moveTo(x-tw,ty);g.quadraticCurveTo(x-tw*.3,ty-th*.45,x,ty-th);g.quadraticCurveTo(x+tw*.3,ty-th*.45,x+tw,ty);g.quadraticCurveTo(x,ty+th*.12,x-tw,ty);g.fill();
    g.fillStyle=lite;g.beginPath();g.moveTo(x,ty-th);g.quadraticCurveTo(x+tw*.3,ty-th*.45,x+tw,ty);g.quadraticCurveTo(x+tw*.5,ty+th*.05,x+tw*.1,ty+th*.04);g.fill()}
  g.fillStyle='#4a3326';g.fillRect(x-1.5,y,3,h*.12);
}
function bush(g,x,y,s,dark,lite){

    for(let i=0;i<10;i++){const x=r()*W;if(Math.abs(x-W/2)<40) continue;bush(g,x,gy-4,5+r()*5,'#5b6b3a','#7f9152')}

function setBar(id,v,max){const el=$(id);const p=clamp(v/max,0,1);el.style.width=(p*100)+'%';el.className=p<.15?'bad':p<.35?'warn':''}
function updateHUD(full){
  if(!S) return;

  $('#h-lv').textContent='LV '+level();

  $('#h-pow').textContent=fmt(S.res.power); setBar('#hb-pow',S.res.power,powMax());
  $('#h-tech').textContent=fmt(S.res.tech);
  $('#h-ap').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<S.res.ap?'on':''}"></i>`).join('');
  $('#n-crew').textContent=S.crew.length+'/'+crewCap();
  $('#n-veh').textContent=S.vehicles.length+' of '+VEH.length;
  $('#b-battle').disabled=!!B;
  document.querySelectorAll('[data-badge]').forEach(el=>{
    const k=el.dataset.badge,r=S.rooms[k]; if(!r) return; const def=ROOMS[r.type],n=crewIn(k).length;
    let t='';
    if(def.prod){const rate=roomRate(k);t=n?(def.prod==='credits'?`+${money(rate)}/s`:`+${rate.toFixed(1)} ${def.prod}/s`):'no crew';el.classList.toggle('low',!n||(def.prod!=='power'&&S.res.power<=0))}
    else if(r.type==='hangar') t=n?'pilot ready':'no pilot';
    else if(def.train) t=n?`training ${def.train==='str'?'Strength':'Aim'}`:'no crew';
    else if(def.beds) t=`${def.beds} bunks`;
    else if(def.heal) t=n?'healing':'no medic';
    else if(def.jail!==undefined) t='prisoners';
    else if(r.type==='clonelab') t='antidote ready';
    el.textContent=t;
  });
}

// ---------- toasts ----------
function toast(msg,kind){
  const box=$('#toasts');const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;box.appendChild(d);
  while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>d.remove(),3800);
}
function advise(key,msg,kind){ if(S.t-(advisor[key]||-99)<40) return; advisor[key]=S.t; toast('Advisor: '+msg,kind||'warn') }

// ---------- speech ----------
function stretch(word){
  const m=word.match(/^([^A-Za-z]*)([A-Za-z']+)([^A-Za-z]*)$/); if(!m) return word+'ooo';
  let w=m[2].replace(/[aeiouAEIOU]/g,v=>v+v.toLowerCase().repeat(ri(1,2)));
  if(w===m[2]) w=w+'aaa';
  w=w.replace(/^([^aeiouAEIOU]+)/,(s)=>s+pick(['oo','ee','aa','uu']));
  return m[1]+w+m[3];
}
function garble(line){
  const ws=line.split(' '); const i=Math.random()<.5?0:ws.length-1; ws[i]=stretch(ws[i]); return ws.join(' ');
}
function sayLine(c){
  pokes[c.id]=(pokes[c.id]||0)+1;
  let line;
  if(c.hurt>0) line=pick(LINES.hurt);
  else if(pokes[c.id]>=4&&!c.isCmd){line=pick(LINES.poke);pokes[c.id]=0;c.mood=clamp(c.mood-3,0,100)}
  else if(!c.room) line=pick(LINES.lobby);
  else if(physOf(c)===2&&Math.random()<.25) line=pick(LINES.strong);
  else if(Math.random()<.35) line=pick(LINES.room[S.rooms[c.room].type]||LINES.ok);
  else line=pick(c.mood>66?LINES.happy:c.mood>35?LINES.ok:LINES.sad);
  return c.clone?garble(line):line;
}

// ---------- crew card ----------
function moodWord(m){return m>66?'Happy':m>35?'Okay':'Grumpy'}
function physHTML(c){
  const p=physOf(c),next=[4.5,7,10][p],prev=[0,4.5,7][p],pct=p===2?100:clamp((c.str-prev)/(next-prev)*100,0,100);
  return `<div><div class="label" style="display:flex;justify-content:space-between"><span>🥷 Physique · ${PHYS[p]}</span><span>${p===2?'Max':'Next: '+PHYS[p+1]}</span></div>
    <div class="phys">${[0,1,2].map(i=>`<i class="${i<=p?'on':''}" style="${i===p+1?`background:linear-gradient(90deg,var(--warn) ${pct}%,rgba(255,255,255,.1) ${pct}%)`:''}"></i>`).join('')}</div></div>`;
}
function crewCard(id,lineOverride){
  const c=S.crew.find(x=>x.id===id); if(!c) return;
  const line=lineOverride||sayLine(c);
  const where=c.room?`${ROOMS[S.rooms[c.room].type].name} (${floorName(+c.room.split(':')[0])})`:'Lobby, no job yet';
  const tags=(c.exClone?'<span class="tag ok">EX-CLONE</span> ':'')+(c.hurt>0?'<span class="tag bad">KNOCKED OUT</span>':'');
  const st=s=>{const b=gearBonus(c,s);return `<b>${Math.floor(c[s])+b}</b>${b?`<small>+${b} gear</small>`:''}`};
  openSheet(esc(c.name),`
    <div class="cmd-row"><div class="portrait">${personHTML(c)}</div><div class="bubble" style="flex:1">${esc(line)}</div></div>
    <div class="row" style="align-items:center"><span class="tag">${esc(titleOf(c))}</span>${tags}<span class="muted" style="font-size:12px">${esc(where)}</span></div>
    ${physHTML(c)}
    <div class="stats">
      <div class="stat"><span class="label">Strength</span>${st('str')}</div>
      <div class="stat"><span class="label">Aim</span>${st('aim')}</div>
      <div class="stat"><span class="label">Smarts</span>${st('smarts')}</div>
    </div>
    <div class="muted" style="font-size:12px">${icon('shirt')} ${esc(OUTFITS[c.outfit||'jumpsuit'].name)} · ⚔️ ${esc(WEAPONS[c.weapon||'none'].name)}</div>
    <div><div class="label">Mood · ${moodWord(c.mood)}</div><div class="bar" style="height:6px"><i style="width:${c.mood}%" class="${c.mood<35?'bad':c.mood<66?'warn':''}"></i></div></div>
    <div class="row">
      <button class="btn" data-act="talk" data-id="${c.id}">TALK</button>
      ${c.isCmd?'':`<button class="btn" data-act="assign" data-id="${c.id}">JOB</button>`}
      <button class="btn" data-act="gear" data-id="${c.id}">GEAR</button>
      <button class="btn" data-act="rename" data-id="${c.id}">RENAME</button>
    </div>

    <div class="muted" style="font-size:12px">Clone clues: a trench coat flash when they arrive, green bare feet, and one stretched out word when they talk.</div>`}
  `);
}

  openSheet('Assign '+esc(c.name),`<div class="list">${items}${c.room?`<button class="li" data-act="assign-to" data-id="${id}" data-k=""><span style="font-size:22px">🚪</span><span class="grow"><b>Lobby</b><span>No job</span></span></button>`:''}</div>`);

function crewList(){
  const items=S.crew.map(c=>`<button class="li" data-act="card" data-id="${c.id}"><span class="mini">${personHTML(c)}</span>
    <span class="grow"><b>${esc(c.name)}</b><span>${esc(titleOf(c))} · ${c.room?esc(ROOMS[S.rooms[c.room].type].name):'Lobby'}</span><span style="display:block">🥷 ${PHYS[physOf(c)]}</span></span>

// ---------- identify + clone choices ----------
function identify(id){
  const c=S.crew.find(x=>x.id===id); if(!c) return;
  if(!c.clone){
    c.mood=clamp(c.mood-15,0,100);
    crewCard(id,pick(INNOCENT));
    toast(c.name+' is not a clone. Their mood went down.','warn');
    return;
  }
  S.caught++; S.res.credits+=5000; S.res.ap=Math.min(5,S.res.ap+1); S.xp+=30;
  flashCoat(c.id);
  toast('Clone caught! +$5,000 bounty and +1 Adventure Point','ok');
  cloneChoice(c);
}
function cloneChoice(c){
  const hasCell=S.jail.length<jailCap(),hasLab=roomsOf('clonelab').length>0,tech=S.res.tech>=30;
  openSheet('Clone caught!',`
    <div class="cmd-row"><div class="portrait">${personHTML(Object.assign({},c,{hurt:0}),'coat')}</div>
    <div class="bubble" style="flex:1">${esc(garble('Hmm. You found me, Commander.'))}</div></div>
    <div class="muted">"${esc(c.name)}" was a clone the whole time. What should we do?</div>
    <div class="grid2">
      <button class="opt" data-act="clone" data-how="exile" data-id="${c.id}"><b>🚪 Exile</b><span>Send them out of the base.</span></button>
      <button class="opt" data-act="clone" data-how="jail" data-id="${c.id}" ${hasCell?'':'disabled'}><b>🔒 Jail</b><span>${hasCell?'Lock them in the Holding Cell.':'Needs a Holding Cell with space (Level 2).'}</span></button>
      <button class="opt" data-act="clone" data-how="cure" data-id="${c.id}" ${hasLab&&tech?'':'disabled'}><b>🧬 Cure</b><span>${hasLab?(tech?'Use 30 tech of antidote.':'Needs 30 tech.'):'Needs a Clone Lab (Level 3).'}</span></button>
      <button class="opt" data-act="clone" data-how="talk" data-id="${c.id}"><b>💬 Recruit</b><span>Talk them into joining. Might not work!</span></button>
    </div>`,true);
}
const TALK=[
  {q:'Whyyy should I staaay heeere?',a:[['We have the best food in the West.',1],['Because I said so!',0],['Here you could be anything. Even a pilot.',2]]},
  {q:'Yooou would truuust me?',a:[['Everyone deserves a second chance.',2],['Not really, but let\'s try.',1],['Nope.',0]]}
];
function talkStep(c,step,score,fromJail){
  if(step>=TALK.length){
    const ok=score>=3;
    if(fromJail){
      if(ok){S.jail=S.jail.filter(p=>p.id!==c.id);c.clone=false;c.exClone=true;c.smarts+=2;c.room=null;c.mood=80;c.joined=S.t;S.crew.push(c);toast(c.name+' joined your crew!','ok')}
      else toast(c.name+' does not trust you yet. Try again later.','warn');
    } else {
      if(ok){c.clone=false;c.exClone=true;c.smarts+=2;c.mood=80;toast(c.name+' joined your crew for real! +2 Smarts','ok')}
      else {S.crew=S.crew.filter(x=>x.id!==c.id);toast(c.name+' said no and ran out the door.','warn')}
    }
    closeSheet(); renderWorld(); save(); return;
  }
  const t=TALK[step];
  openSheet('Talking to '+esc(c.name),`<div class="cmd-row"><div class="portrait">${personHTML(Object.assign({},c,{hurt:0}))}</div><div class="bubble" style="flex:1">${esc(t.q)}</div></div>
    <div class="list">${t.a.map(([txt,pts])=>`<button class="li" data-act="talk-ans" data-id="${c.id}" data-step="${step}" data-score="${score+pts}" data-jail="${fromJail?1:0}"><span class="grow"><b>${esc(txt)}</b></span></button>`).join('')}</div>`,!fromJail);
}
function resolveClone(id,how){
  const c=S.crew.find(x=>x.id===id); if(!c) return;
  if(how==='exile'){S.crew=S.crew.filter(x=>x.id!==id);toast(c.name+' was exiled. Bye!','ok')}
  else if(how==='jail'){S.crew=S.crew.filter(x=>x.id!==id);c.room=null;S.jail.push(c);toast(c.name+' is in the Holding Cell.','ok')}
  else if(how==='cure'){S.res.tech-=30;c.clone=false;c.exClone=true;c.mood=85;toast('The antidote worked! '+c.name+' is a real crew member now.','ok')}
  else if(how==='talk'){talkStep(c,0,0,false);return}
  closeSheet(); renderWorld(); save();
}

// ---------- building ----------
function buildSheet(k){
  const lv=level();
  const items=Object.keys(ROOMS).filter(t=>t!=='hq').map(t=>{
    const d=ROOMS[t],lock=d.level&&lv<d.level,poor=S.res.credits<d.cost;
    return `<button class="opt" data-act="build" data-k="${k}" data-t="${t}" ${lock||poor?'disabled':''}><b>${d.icon} ${esc(d.name)}</b><span>${esc(d.desc)}</span><span class="cost">${lock?'Needs Level '+d.level:money(d.cost)}</span></button>`}).join('');
  openSheet('Build a room · '+floorName(+k.split(':')[0]),`<div class="grid2">${items}</div>`);
}
function roomSheet(k){
  const r=S.rooms[k],def=ROOMS[r.type],people=crewIn(k);
  const list=people.map(c=>`<button class="li" data-act="card" data-id="${c.id}"><span class="mini">${personHTML(c)}</span><span class="grow"><b>${esc(c.name)}</b><span>${esc(titleOf(c))}</span></span></button>`).join('')||'<div class="muted">Nobody works here yet.</div>';
  const free=S.crew.filter(c=>!c.isCmd&&c.room!==k);
  let extra='';
  const lv=rL(k),upCost=Math.round((def.cost||50000)*lv*.8),lock=level()<lv*3;
  const [fl,sl]=k.split(':').map(Number),w=rW(k),canR=sl+w<=2&&!owner(fl,sl+w),canL=sl>0&&!owner(fl,sl-1),expCost=Math.round((def.cost||60000)*.75);
  const upHTML=`<div class="label">Room upgrades</div><div class="grid2">
    <button class="opt" data-act="rlvl" data-k="${k}" ${lv>=5||lock||S.res.credits<upCost?'disabled':''}><b>★ Upgrade to Level ${Math.min(5,lv+1)}</b><span>+25% output and fancier decor.</span><span class="cost">${lv>=5?'MAX LEVEL':lock?'Needs base Level '+(lv*3):money(upCost)}</span></button>
    <button class="opt" data-act="rwide" data-k="${k}" data-dir="${canR?'r':'l'}" ${w>=3||!(canR||canL)||S.res.credits<expCost?'disabled':''}><b>↔ Expand to ${Math.min(3,w+1)} wide</b><span>${w>=3?'As wide as it gets.':(canR||canL)?'Knock down the wall to the empty spot next door. More crew and storage.':'Needs an empty spot right next to it.'}</span><span class="cost">${w>=3?'MAX':money(expCost)}</span></button></div>
    <div class="muted" style="font-size:12px">Tap the floor number on the left to raise the ceiling (double height at Level 3, triple at Level 10).</div>`;
  if(r.type==='hangar') extra=`<button class="btn primary" data-act="hangar">${icon('plane')} OPEN HANGAR · LAUNCH MISSIONS</button>`;
  if(r.type==='cell'&&S.jail.length) extra=`<div class="label">Prisoners</div><div class="list">${S.jail.map(p=>`<button class="li" data-act="prisoner" data-id="${p.id}"><span class="mini">${personHTML(p)}</span><span class="grow"><b>${esc(p.name)}</b><span>Tap to talk</span></span></button>`).join('')}</div>`;
  openSheet(def.icon+' '+esc(def.name),`<div class="muted">${esc(def.desc)}</div>
    <div class="label">Crew ${people.length}/${roomCap(k)}</div><div class="list">${list}</div>
    ${people.length<roomCap(k)&&free.length?`<div class="label">Add someone</div><div class="list">${free.slice(0,8).map(c=>`<button class="li" data-act="assign-to" data-id="${c.id}" data-k="${k}"><span class="mini">${personHTML(c)}</span><span class="grow"><b>${esc(c.name)}</b><span>${c.room?'Now in '+esc(ROOMS[S.rooms[c.room].type].name):'In the lobby'}</span></span></button>`).join('')}</div>`:''}
    ${upHTML}${extra}`);
}
function floorSheet(f){
  const h=(S.floorH[f])||1,lv=level();
  const opts=[[2,3,75000,'Double height ceiling'],[3,10,300000,'Triple height mega floor']];
  const items=opts.map(([nh,need,cost,name])=>{const done=h>=nh,lock=lv<need,poor=S.res.credits<cost;return `<button class="opt ${done?'on':''}" data-act="raise" data-f="${f}" data-h="${nh}" data-cost="${cost}" ${done||lock||poor||h!==nh-1?'disabled':''}><b>${name}</b><span>Every room on this floor gets ${nh} times taller. +20% output per extra story, plus more crew and parking.</span><span class="cost">${done?'BUILT':lock?'Needs base Level '+need:money(cost)}</span></button>`}).join('');
  openSheet('Floor '+floorName(f),`<div class="muted">Ceiling height: ${h===1?'standard':h+' stories'}.</div><div class="grid2">${items}</div>`);
}
function turretSheet(i){
  const t=S.turrets[i],lv=level();
  if(!t){
    const items=Object.keys(TURRETS).map(tp=>{const d=TURRETS[tp],lock=d.level&&lv<d.level,poor=S.res.credits<d.cost||(d.tech&&S.res.tech<d.tech);
      return `<button class="opt" data-act="turret" data-i="${i}" data-t="${tp}" ${lock||poor?'disabled':''}><b>${esc(d.name)}</b><span>${esc(d.desc)}</span><span class="cost">${lock?'Needs Level '+d.level:money(d.cost)+(d.tech?' + '+d.tech+' tech':'')}</span></button>`}).join('');
    openSheet('Build a defense',`<div class="muted">Turrets protect the base door from raiders and monsters.</div><div class="grid2">${items}</div>`);
    return;
  }
  const d=TURRETS[t.type],cost=d.cost*t.lvl;
  openSheet(esc(d.name)+' '+'★'.repeat(t.lvl),`<div class="muted">${esc(d.desc)}</div>
    <div class="stats"><div class="stat"><span class="label">Damage</span><b>${(d.dmg*(1+.5*(t.lvl-1))).toFixed(0)}</b></div><div class="stat"><span class="label">Range</span><b>${d.range}</b></div><div class="stat"><span class="label">Level</span><b>${t.lvl}/3</b></div></div>
    <button class="btn primary" data-act="upgrade" data-i="${i}" ${t.lvl>=3||S.res.credits<cost?'disabled':''}>${t.lvl>=3?'MAX LEVEL':'UPGRADE · '+money(cost)}</button>`);
}

// ---------- hangar + 3D showroom ----------
let hangarTab='air';
const CAT_NAME={air:'Aircraft',ground:'Ground',sea:'Boats'};
function hangarSheet(){
  const lv=level();
  const items=VEH.filter(v=>v.cat===hangarTab).map(v=>{
    const own=S.vehicles.includes(v.id);
    let right;
    if(own) right=`<span class="tag ok">OWNED</span>`;
    else if(v.locked) right=`<span class="tag dim">SOON</span>`;
    else if(v.level&&lv<v.level) right=`<span class="tag dim">LV ${v.level}</span>`;

    const era=v.era==='future'?'<span class="tag">FUTURISTIC</span>':'<span class="tag dim">CLASSIC</span>';

  openSheet(`${icon('plane')} Hangar · ${S.vehicles.length} of ${VEH.length}`,`
    <div class="muted" style="font-size:12px">Parking: ${S.vehicles.length}/${vehCap()} spots (4 per Hangar room). Prices are close to real life, so jets are a long term goal. Winning battles can also bring home vehicles the raiders left behind. Tap any vehicle to see it in 3D.</div>
    <div class="tabs">${tab('air')}${tab('ground')}${tab('sea')}</div>
    <div class="list">${items}</div>`);
}
function showroomSheet(vid){
  const v=VEH.find(x=>x.id===vid),own=S.vehicles.includes(v.id),lv=level();
  let actions='';
  if(own){
    actions=`<button class="btn primary" data-act="launch" data-v="${v.id}" style="font-family:var(--font-display)">${icon('rocket')} LAUNCH MISSION</button>`;
    if(v.upg&&!S.upg[v.id]) actions+=`<button class="btn" data-act="upg" data-v="${v.id}" ${S.res.credits<v.upg.cost?'disabled':''}>${icon('target')} ADD ${esc(v.upg.name.toUpperCase())} · ${money(v.upg.cost)}</button>`;
  } else if(v.locked) actions=`<div class="muted">${esc(v.locked)}.</div>`;
  else if(v.level&&lv<v.level) actions=`<div class="muted">Reach base Level ${v.level} to buy this one.</div>`;
  else {const can=S.res.credits>=v.cost&&(!v.tech||S.res.tech>=v.tech)&&S.vehicles.length<vehCap();
    actions=`<button class="btn primary" data-act="buy" data-v="${v.id}" ${can?'':'disabled'}>BUY · ${money(v.cost)}${v.tech?' + '+v.tech+' tech':''}</button>${S.vehicles.length>=vehCap()?'<div class="muted" style="font-size:12px">Hangar is full. Build another Hangar room.</div>':S.res.credits<v.cost?`<div class="muted" style="font-size:12px">You need ${money(v.cost-S.res.credits)} more.</div>`:''}`}
  openSheet(`${v.e} ${esc(v.name)}`,`
    <canvas class="show3d" id="show3d"></canvas>
    <div class="row" style="align-items:center">${v.era==='future'?'<span class="tag">FUTURISTIC</span>':'<span class="tag dim">CLASSIC</span>'}<span class="tag dim">${esc(CAT_NAME[v.cat].toUpperCase())}</span>${isArmed(v)?'<span class="tag bad">ZAPPER</span>':''}<span class="muted" style="font-size:12px">Drag to spin</span></div>
    ${v.spd?`<div class="stats"><div class="stat"><span class="label">Speed</span><b>${v.spd}</b></div><div class="stat"><span class="label">Armor</span><b>${v.arm}</b></div><div class="stat"><span class="label">Price</span><b style="font-size:13px">${money(v.cost)}</b></div></div>`:''}
    ${actions}
    <button class="btn" data-act="hangar">BACK TO HANGAR</button>`);
  if(!v.locked) startShowroom(v);

function startShowroom(v){

function tur3dLoop(now){

  const dt=Math.min(.1,(now-T3.last)/1000);T3.last=now;T3.acc+=dt;
  if(M||document.hidden||!T3.cv.isConnected||T3.acc<1/30) return;
  const step=T3.acc;T3.acc=0;
  T3.units.forEach((u,i)=>{if(!u) return;const U=u.g.userData;
    const firing=now/1000-u.lastFire<1.2;

    u.yaw+=(u.aimYaw-u.yaw)*Math.min(1,step*8);u.pitch+=(u.aimPitch-u.pitch)*Math.min(1,step*8);
    U.head.rotation.y=u.yaw;U.pitch.rotation.z=u.pitch;
    u.recoil=Math.max(0,u.recoil-step*8);U.pitch.position.x=-u.recoil*2;

function tick(){

  S.xp+=.25;
  {const L=level();if(S.lastLv===undefined) S.lastLv=L;
    if(L>S.lastLv){const oe=eraOf(S.lastLv),ne=eraOf(L);S.lastLv=L;

      if(ne!==oe) setTimeout(()=>toast(`New base style unlocked: ${ne.name}!`,'ok'),900);
      if((ne!==oe||L%10===0)&&!M) renderWorldSoon()}}
  for(const k of Object.keys(S.rooms)){
    const def=ROOMS[S.rooms[k].type];
    if(def.prod) r[def.prod]+=roomRate(k);
    for(const c of crewIn(k)){
      if(c.hurt) continue;
      c.xp+=.5;
      if(def.train){const before=physOf(c);c[def.train]=Math.min(10,c[def.train]+.03);if(physOf(c)>before){grew=true;toast(`🥷 ${c.name} reached ${PHYS[physOf(c)]} physique!`,'ok')}}
    }
  }
  if(grew&&!M) renderWorldSoon();
  r.food-=.12*S.crew.length; r.power-=.08*Object.keys(S.rooms).length;
  r.food=clamp(r.food,0,foodMax()); r.power=clamp(r.power,0,powMax());
  const medOn=roomsOf('med').some(k=>crewIn(k).some(c=>!c.hurt));
  for(const c of S.crew){
    const target=r.food<=0?20:r.power<=0?45:(c.room?78:60);
    c.mood+=(target-c.mood)*.02;
    if(c.hurt>0){c.hurt=Math.max(0,c.hurt-(medOn?4:1)); if(!c.hurt&&!M) renderWorldSoon()}
  }
  if(S.t%30===0&&r.ap<5) r.ap++;

    if(r.food<=0) advise('food','The crew is hungry! Put someone in the Food Hall.','bad');
    else if(r.food<foodMax()*.15) advise('foodlow','Food is getting low.');

    }

  else if(a==='equip'){const c=S.crew.find(x=>x.id===id),d=(b.dataset.kind==='outfit'?OUTFITS:WEAPONS)[b.dataset.key];if(S.res.credits<d.cost||(d.tech&&S.res.tech<d.tech))return;S.res.credits-=d.cost;if(d.tech)S.res.tech-=d.tech;c[b.dataset.kind]=b.dataset.key;renderWorld();save();toast(`${c.name} equipped the ${d.name}!`,'ok');gearSheet(id)}
  else if(a==='rename') renameSheet(id);
  else if(a==='rename-save'){const c=S.crew.find(x=>x.id===id);const v=$('#rn').value.trim();if(v){c.name=v.slice(0,18);if(c.isCmd)S.cmd.name=c.name}renderWorld();save();crewCard(id,'Nice. I like my new name!')}
  else if(a==='assign-to'){const c=S.crew.find(x=>x.id===id);const k=b.dataset.k||null;if(k&&crewIn(k).length>=roomCap(k))return;c.room=k;renderWorld();save();toast(`${c.name} now works ${k?'in the '+ROOMS[S.rooms[k].type].name:'nowhere (lobby)'}.`);closeSheet()}
  else if(a==='identify') identify(id);
  else if(a==='clone') resolveClone(id,b.dataset.how);
  else if(a==='talk-ans'){const fromJail=b.dataset.jail==='1';const c=fromJail?S.jail.find(x=>x.id===id):S.crew.find(x=>x.id===id);talkStep(c,+b.dataset.step+1,+b.dataset.score,fromJail)}
  else if(a==='prisoner'){const p=S.jail.find(x=>x.id===id);if(p) talkStep(p,0,0,true)}
  else if(a==='build'){const t=b.dataset.t,d=ROOMS[t];if(S.res.credits<d.cost)return;S.res.credits-=d.cost;S.rooms[b.dataset.k]={type:t,w:1,lvl:1};S.xp+=10;closeSheet();renderWorld();save();toast(`${d.name} built! Tap it to add crew.`,'ok')}
  else if(a==='turret'){const d=TURRETS[b.dataset.t];S.res.credits-=d.cost;if(d.tech)S.res.tech-=d.tech;S.turrets[+b.dataset.i]={type:b.dataset.t,lvl:1};closeSheet();renderWorld();save();toast(d.name+' ready!','ok')}
  else if(a==='upgrade'){const t=S.turrets[+b.dataset.i],cost=TURRETS[t.type].cost*t.lvl;if(S.res.credits<cost)return;S.res.credits-=cost;t.lvl++;renderWorld();save();turretSheet(+b.dataset.i)}
  else if(a==='raise'){const f=+b.dataset.f,cost=+b.dataset.cost;if(S.res.credits<cost)return;S.res.credits-=cost;S.floorH[f]=+b.dataset.h;S.xp+=20;renderWorld();save();toast(`Floor ${floorName(f)} is now ${b.dataset.h} stories tall!`,'ok');floorSheet(f)}
  else if(a==='rlvl'){const k=b.dataset.k,r=S.rooms[k],cost=Math.round((ROOMS[r.type].cost||50000)*rL(k)*.8);if(S.res.credits<cost)return;S.res.credits-=cost;r.lvl=rL(k)+1;S.xp+=15;renderWorld();save();toast(`${ROOMS[r.type].name} upgraded to Level ${r.lvl}!`,'ok');roomSheet(k)}
  else if(a==='rwide'){let k=b.dataset.k;const r=S.rooms[k],cost=Math.round((ROOMS[r.type].cost||60000)*.75);if(S.res.credits<cost)return;S.res.credits-=cost;r.w=rW(k)+1;
    if(b.dataset.dir==='l'){const [f,sl]=k.split(':').map(Number),nk=f+':'+(sl-1);S.rooms[nk]=r;delete S.rooms[k];S.crew.forEach(c=>{if(c.room===k)c.room=nk});k=nk}
    S.xp+=15;renderWorld();save();toast(`${ROOMS[r.type].name} expanded to ${r.w} wide!`,'ok');roomSheet(k)}
  else if(a==='hangar') hangarSheet();
  else if(a==='htab'){hangarTab=b.dataset.t;hangarSheet()}
  else if(a==='show') showroomSheet(b.dataset.v);
  else if(a==='buy'){const v=VEH.find(x=>x.id===b.dataset.v);if(S.res.credits<v.cost)return;S.res.credits-=v.cost;if(v.tech)S.res.tech-=v.tech;S.vehicles.push(v.id);renderWorld();save();toast(v.name+' added to your Hangar!','ok');showroomSheet(v.id)}
  else if(a==='upg'){const v=VEH.find(x=>x.id===b.dataset.v);if(S.res.credits<v.upg.cost)return;S.res.credits-=v.upg.cost;S.upg[v.id]=true;save();updateHUD();toast(`${v.upg.name} installed on the ${v.name}! Strike missions unlocked.`,'ok');showroomSheet(v.id)}
  else if(a==='launch') missionSheet(b.dataset.v);
  else if(a==='go') startMission(b.dataset.v);
  else if(a==='m-resume'){closeSheet();if(M){M.paused=false;M.last=performance.now()}}
  else if(a==='m-quit'){closeSheet();closeMission();renderWorld()}
  else if(a==='fight'&&pendingWave){startBattle(pendingWave,true);pendingWave=null}
  else if(a==='reset-yes'){try{localStorage.removeItem(KEY)}catch(err){} location.reload()}
  else if(a==='reset'){openSheet('Start over?',`<div class="muted">This erases your base, crew and hangar on this device.</div><div class="row"><button class="btn" data-close>KEEP PLAYING</button><button class="btn danger" data-act="reset-yes">ERASE AND RESTART</button></div>`)}
});
$('#b-crew').onclick=crewList;
$('#b-hangar').onclick=hangarSheet;
$('#b-battle').onclick=battlePreview;
$('#b-recruit').onclick=()=>{ if(S.res.credits<2500){toast('Recruiting costs $2,500.','warn');return} if(S.crew.length>=crewCap()){toast('No bunks left! Build Sleeping Quarters first.','warn');return} S.res.credits-=2500; arrival(false) };
$('#b-gear').onclick=()=>openSheet('Settings',`<div class="muted">Commander ${esc(S.cmd.name)} · ${esc(FACTIONS[S.faction].name)} · Battles won: ${S.wins} · Clones caught: ${S.caught} · Outposts found: ${Object.keys(S.found||{}).length}</div>
  ${eraLadder()}<div class="muted" style="font-size:12px">BASED prototype v0.4. Your game saves on this device automatically.</div><button class="btn danger" data-act="reset">START A NEW BASE</button>`);
document.querySelectorAll('[data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin',icon(el.dataset.ic)));
$('#b-gear').innerHTML=icon('gear');

// ---------- setup screen ----------
function renderSetup(){
  const sw=(id,list,key)=>{$(id).innerHTML=list.map(c=>`<button class="sw ${setupCfg[key]===c?'on':''}" style="background:${c}" data-k="${key}" data-c="${c}" aria-label="${key} ${c}"></button>`).join('')};
  sw('#sw-skin',SKINS,'skin'); sw('#sw-hair',HAIRS,'hair'); sw('#sw-suit',SUITS,'suit');
  $('#sw-hs').innerHTML=['Spiky','Ponytail','Swept','Messy'].map((n,i)=>`<button class="btn ${setupCfg.hs===i?'primary':''}" style="padding:6px 10px;font-size:12px" data-hs="${i}">${n}</button>`).join('');
  $('#cmd-preview').innerHTML=personHTML({id:-1,skin:setupCfg.skin,hair:setupCfg.hair,shirt:'#262b31',trim:setupCfg.suit,hs:setupCfg.hs,eye:EYES[0],isCmd:true,str:5,weapon:'katana'});
  $('#factions').innerHTML=Object.keys(FACTIONS).map(k=>{const f=FACTIONS[k];return `<button class="fac ${setupCfg.faction===k?'on':''} ${f.locked?'locked':''}" data-f="${k}" ${f.locked?'aria-disabled="true"':''}><span class="biome">${f.icon}</span><b>${esc(f.name)}</b><span>${esc(f.place)}</span><span>${esc(f.blurb)}</span></button>`}).join('');
}
$('#setup').addEventListener('click',e=>{
  const s=e.target.closest('.sw'); if(s){setupCfg[s.dataset.k]=s.dataset.c;renderSetup();return}
  const h=e.target.closest('[data-hs]'); if(h){setupCfg.hs=+h.dataset.hs;renderSetup();return}
  const f=e.target.closest('.fac'); if(f){ if(FACTIONS[f.dataset.f].locked){toast(FACTIONS[f.dataset.f].name+' unlocks later in the game!');return} setupCfg.faction=f.dataset.f;renderSetup() }
});
$('#found').onclick=()=>{
  const name=($('#cmd-name').value.trim()||'Commander Ace').slice(0,18);
  newGame(Object.assign({name},setupCfg)); save(); startGame(true);
};

function startGame(fresh){
  $('#setup').hidden=true; $('#game').hidden=false;
  S.found=S.found||{};S.upg=S.upg||{};S.floorH=S.floorH||{};
  renderWorld(); lastW=$('#world').clientWidth; requestAnimationFrame(()=>{paintWorld();scrollToSurface(false)});
  if(fresh){ toast(`Welcome, ${S.cmd.name}! Tap rooms, crew, and the build spots.`,'ok'); setTimeout(()=>toast('Open the Hangar, tap a vehicle to see it in 3D, then launch a mission!'),4000) }
  setInterval(tick,1000);
  initTur3D();
}

const saved=load();
if(saved&&(saved.v===1||saved.v===2)){S=migrate(saved); startGame(false)}
else { $('#setup').hidden=false; renderSetup(); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save() });
})();
</script>
