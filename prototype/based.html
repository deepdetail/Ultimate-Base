<title>BASED Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen phone game. Fixed HUD on top, scrolling cutaway base in the middle (tower in a painted anime landscape, surface with turrets, bunker below), nav bar at the bottom. Missions open a full-screen 3D layer. */
:root{
  --gm-950:#171A1E; --gm-900:#1E2227; --gm-800:#2B3036; --gm-700:#3A4149; --gm-600:#4A525C;
  --steel:#8A939E; --steel-hi:#C9D1D9;
  --teal:#2EC4C9; --teal-dim:rgba(46,196,201,.16);
  --text:#F4F7FA; --muted:#A9B3BE;
  --blue:#3A8DDE; --ok:#3DDC97; --warn:#FFC845; --bad:#FF4D5E; --clone:#5BE36B;
  --lamp:#FFE7B0;
  --font-display:'Orbitron','Arial Black',system-ui,sans-serif;
  --font-body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--gm-950);color:var(--text);font-family:var(--font-body);font-size:14px;overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.metal{background:linear-gradient(135deg,var(--gm-600) 0%,var(--gm-700) 42%,var(--gm-800) 100%);position:relative;overflow:hidden}
.metal::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(201,209,217,.16) 44%,transparent 58%);pointer-events:none}
.btn{border:1px solid rgba(201,209,217,.22);border-radius:8px;padding:10px 14px;font-weight:700;letter-spacing:.04em;background:linear-gradient(180deg,var(--gm-600),var(--gm-800))}
.btn.primary{background:linear-gradient(180deg,#3fd6db,#1f9ea3);color:#06282a;border-color:#7ff0f3}
.btn.danger{background:linear-gradient(180deg,#ff6b79,#c93241);color:#fff;border-color:#ff9aa4}
.btn:disabled{opacity:.4;cursor:not-allowed}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}

/* ---------- Setup screen ---------- */
#setup{height:100%;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;background:radial-gradient(120% 60% at 50% 0%,#2a3b44 0%,var(--gm-950) 70%)}
.setup-inner{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--font-display);font-weight:800;font-size:56px;letter-spacing:.14em;text-align:center;background:linear-gradient(180deg,#fff 0%,var(--steel-hi) 45%,var(--steel) 55%,#e6edf3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(46,196,201,.45));line-height:1}
.tagline{text-align:center;color:var(--teal);letter-spacing:.3em;font-size:12px;text-transform:uppercase;margin-top:-8px}
.card{border-radius:12px;border:1px solid rgba(201,209,217,.14);padding:14px;display:flex;flex-direction:column;gap:10px}
.cmd-row{display:flex;gap:14px;align-items:center}
.portrait{width:84px;height:140px;flex:none;position:relative;border-radius:12px;background:radial-gradient(circle at 50% 75%,rgba(255,231,176,.25),transparent 70%)}
.portrait .person{position:absolute;left:6px;top:2px;bottom:auto;width:72px;height:135px;animation:none;pointer-events:none}
input[type=text]{width:100%;background:var(--gm-950);border:1px solid var(--gm-600);border-radius:8px;padding:10px;color:var(--text);font:600 16px var(--font-body)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--gm-900),0 0 10px var(--teal)}
.factions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fac{text-align:left;border-radius:10px;border:1px solid rgba(201,209,217,.16);padding:10px;display:flex;flex-direction:column;gap:4px;min-height:112px;background:var(--gm-800)}
.fac b{font-family:var(--font-display);font-size:11px;letter-spacing:.06em}
.fac span{font-size:12px;color:var(--muted)}
.fac.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal),0 0 16px rgba(46,196,201,.25)}
.fac.locked{opacity:.45;cursor:not-allowed}
.fac .biome{font-size:22px}

/* ---------- Game shell ---------- */
#game{height:100%;display:flex;flex-direction:column}
#hud{flex:none;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;border-bottom:1px solid rgba(201,209,217,.14);z-index:20}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.hud-top .who{display:flex;align-items:baseline;gap:8px;min-width:0}
.hud-top .who h3{font-size:16px;letter-spacing:.12em}
#h-place{min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{flex:none;font-family:var(--font-display);font-size:11px;color:#06282a;background:var(--teal);border-radius:4px;padding:2px 6px}
.gear{background:none;border:1px solid rgba(201,209,217,.2);border-radius:6px;width:32px;height:28px;font-size:15px}
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chip{background:var(--gm-950);border:1px solid rgba(201,209,217,.12);border-radius:6px;padding:4px 6px;min-width:0}
.chip .k{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.chip .v{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .4s}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.12)}
.pips i.on{background:var(--teal);box-shadow:0 0 6px var(--teal)}

#wrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;background:var(--gm-950)}
#world{max-width:520px;margin:0 auto;position:relative;min-height:100%;display:flex;flex-direction:column}
#bg{position:absolute;left:0;top:0;width:100%;z-index:0;pointer-events:none}
#world>.layer{position:relative;z-index:1}
#world .under{flex:1}
.pad-x{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.expand{display:flex;justify-content:center;padding-block:12px}
.expand button{background:rgba(23,26,30,.6);border:1.5px dashed var(--teal);color:var(--teal);border-radius:8px;padding:8px 14px;font-weight:700;letter-spacing:.06em}
.tower,.bunker{padding:4px;display:flex;flex-direction:column;gap:4px}
.tower{background:linear-gradient(90deg,#2b3036,#4a525c 30%,#3a4149 70%,#22262b);box-shadow:0 6px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(201,209,217,.35);border-radius:12px 12px 0 0}
.bunker{background:rgba(15,12,10,.55);border-radius:0 0 12px 12px;box-shadow:inset 0 6px 16px rgba(0,0,0,.5)}
.floor{display:grid;grid-template-columns:22px repeat(3,minmax(0,1fr));gap:4px}
.shaft{background:linear-gradient(90deg,#15181c,#2b3036,#15181c);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:9px;color:var(--teal);writing-mode:vertical-rl;letter-spacing:.1em}
.slot{height:96px;border-radius:7px;min-width:0}
.slot-empty{border:1.5px dashed rgba(46,196,201,.6);background:rgba(23,26,30,.5);color:var(--teal);font-weight:700;font-size:12px;letter-spacing:.06em;width:100%}
/* rooms are little dioramas: back wall, side walls, ceiling lamp, perspective floor */
.room{position:relative;overflow:hidden;border:1px solid rgba(201,209,217,.22);border-top-color:rgba(201,209,217,.45);text-align:left;padding:0;width:100%;
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,231,176,.22),transparent 60%),linear-gradient(180deg,#5d6772 0%,#46505a 60%,#3a4149 100%);
  box-shadow:inset 12px 0 12px -8px rgba(0,0,0,.5),inset -12px 0 12px -8px rgba(0,0,0,.5),inset 0 10px 10px -8px rgba(0,0,0,.55)}
.room .lamp{position:absolute;left:50%;top:0;width:34%;height:3px;transform:translateX(-50%);background:var(--lamp);border-radius:0 0 3px 3px;box-shadow:0 0 10px var(--lamp)}
.room .flr{position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(180deg,#8d96a1,#5a636d);clip-path:polygon(9% 0,91% 0,100% 100%,0 100%)}
.room .flr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 18px,rgba(0,0,0,.12) 18px 19px)}
.room .prop{position:absolute;right:6px;bottom:20px;font-size:24px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.room .rh{position:absolute;left:6px;top:6px;right:6px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.room .rb{position:absolute;left:6px;top:20px;font-size:10px;color:var(--teal);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.room .rb.low{color:var(--warn)}
.room .park{position:absolute;right:4px;top:30px;display:flex;gap:1px;font-size:17px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
.room.hq{border-color:rgba(46,196,201,.6)}
.room .bars{position:absolute;inset:16px 0 0 0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(201,209,217,.55) 9px 11px);pointer-events:none;z-index:4}

/* surface */
.surface{position:relative;height:150px;overflow:hidden}
.surface canvas#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.door{position:absolute;left:50%;bottom:24px;width:50px;height:60px;transform:translateX(-50%);border-radius:25px 25px 0 0;border:3px solid var(--steel-hi);background:linear-gradient(90deg,var(--gm-700) 0 49%,var(--gm-950) 49% 51%,var(--gm-700) 51%);box-shadow:0 0 18px rgba(46,196,201,.45),0 6px 10px rgba(0,0,0,.3)}
.door::after{content:"";position:absolute;left:50%;top:8px;width:10px;height:4px;transform:translateX(-50%);background:var(--teal);border-radius:2px;box-shadow:0 0 8px var(--teal)}
.sign{position:absolute;left:50%;bottom:94px;transform:translateX(-50%);font-family:var(--font-display);font-size:10px;letter-spacing:.2em;color:var(--text);background:rgba(23,26,30,.75);padding:3px 8px;border-radius:4px;border:1px solid var(--teal);white-space:nowrap}
.lobby{position:absolute;left:30%;right:30%;bottom:20px;height:46px}
.tpad{position:absolute;bottom:24px;width:38px;height:40px;transform:translateX(-50%);border:none;background:none;padding:0;z-index:4}
.tpad.empty::before{content:"+";position:absolute;inset:6px 2px 0;border:1.5px dashed var(--teal);border-radius:6px;color:var(--teal);display:grid;place-items:center;font-size:18px;background:rgba(23,26,30,.45)}
.tur .base{position:absolute;bottom:0;left:5px;width:28px;height:12px;background:linear-gradient(180deg,var(--steel),var(--gm-600));clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.tur .dome{position:absolute;bottom:10px;left:10px;width:18px;height:15px;border-radius:9px 9px 2px 2px;background:radial-gradient(circle at 35% 30%,#fff,var(--steel-hi) 25%,var(--gm-600));z-index:2}
.tur .barrel{position:absolute;bottom:18px;left:18px;width:20px;height:4px;border-radius:2px;background:var(--steel-hi);transform-origin:1px 2px;transform:rotate(var(--a,-15deg));transition:transform .12s}
.tur.net .barrel{background:var(--teal);height:6px}
.tur.laser .barrel{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.tur .stars{position:absolute;bottom:-1px;left:0;right:0;text-align:center;font-size:8px;color:var(--warn);z-index:3}
.enemy{position:absolute;bottom:20px;transform:translateX(-50%);z-index:5;font-size:26px;line-height:1;pointer-events:none}
.enemy .em{display:block}
.enemy.flip .em{transform:scaleX(-1)}
.enemy.big{font-size:36px}
.enemy .hpb{position:absolute;left:4px;right:4px;top:-6px;height:4px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
.enemy .hpb i{display:block;height:100%;background:var(--bad)}
.enemy.ko .hpb{display:none}
.enemy.ko::after{content:"💫";position:absolute;left:50%;top:-18px;transform:translateX(-50%);font-size:16px}
.shield{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:62%;z-index:7;text-align:center}
.shield .bar{height:7px;border:1px solid rgba(255,255,255,.3)}
.shield .label{color:var(--text);font-size:10px;text-shadow:0 1px 2px #000}

/* people: chibi anime crew drawn in SVG */
.person{position:absolute;bottom:3px;left:var(--x,40%);width:26px;height:49px;animation:pace var(--d,4s) ease-in-out infinite alternate;z-index:2;cursor:pointer}
.person::after{content:"";position:absolute;inset:-8px -8px -2px}
.person svg{width:100%;height:100%;display:block;overflow:visible;animation:bob .55s ease-in-out infinite}
@keyframes pace{from{transform:translateX(calc(var(--r,14px) * -1))}to{transform:translateX(var(--r,14px))}}
@keyframes bob{50%{transform:translateY(-1.2px)}}
.person .coatg{display:none}
.person.coat .coatg{display:inline}
.person.hurt,.person.jailed{animation:none}
.person.hurt svg,.person.jailed svg{animation:none}
.person.hurt{opacity:.8}
.portrait .person svg,.mini .person svg{animation:none}

/* nav */
#nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1.6fr 1fr;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;border-top:1px solid rgba(201,209,217,.14);z-index:20}
#nav .btn{padding:8px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px}
#nav .btn small{font-size:9px;font-weight:600;opacity:.8;letter-spacing:.04em}
#nav .battle{background:linear-gradient(180deg,#ff6b79,#b82a38);border-color:#ff9aa4;font-family:var(--font-display);font-size:11px}

/* sheet + toasts */
#sheet{position:fixed;inset:0;z-index:90;background:rgba(10,12,14,.6);display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:520px;max-height:84%;overflow-y:auto;border-radius:16px 16px 0 0;border:1px solid rgba(201,209,217,.2);border-bottom:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-h h2{font-size:17px;letter-spacing:.06em}
.x{background:none;border:1px solid rgba(201,209,217,.25);border-radius:6px;width:32px;height:32px;font-size:16px;flex:none}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:1px solid rgba(201,209,217,.16);border-radius:10px;padding:10px;background:var(--gm-800);display:flex;flex-direction:column;gap:3px;min-width:0}
.opt b{font-size:13px}
.opt span{font-size:11.5px;color:var(--muted)}
.opt .cost{color:var(--teal);font-weight:700}
.opt:disabled{opacity:.4}
.bubble{position:relative;background:var(--text);color:var(--gm-900);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:var(--text);border-left:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--gm-950);border-radius:6px;padding:6px;text-align:center}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 120px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;background:var(--gm-800);border:1px solid rgba(201,209,217,.1);text-align:left;width:100%}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .grow span{font-size:11.5px;color:var(--muted)}
.mini{width:26px;height:48px;position:relative;flex:none}
.mini .person{animation:none;left:0;bottom:0;width:26px;height:48px;pointer-events:none}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;padding:8px 4px;border-radius:8px;border:1px solid rgba(201,209,217,.18);background:var(--gm-800);font-weight:700;font-size:11px}
.tabs button.on{border-color:var(--teal);color:var(--teal);background:var(--teal-dim)}
.veh{font-size:30px;width:44px;text-align:center;flex:none}
.tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--teal-dim);color:var(--teal);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.tag.bad{background:rgba(255,77,94,.15);color:var(--bad)}
.tag.ok{background:rgba(61,220,151,.15);color:var(--ok)}
.tag.dim{background:rgba(255,255,255,.08);color:var(--muted)}
.big-emoji{font-size:44px;text-align:center}
.route{display:flex;flex-direction:column;gap:4px;padding-left:4px}
.route div{display:flex;gap:8px;align-items:center;font-size:13px}
.route i{width:10px;height:10px;border-radius:50%;border:2px solid var(--teal);flex:none}
.route .fin i{background:var(--bad);border-color:var(--bad)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);z-index:95;display:flex;flex-direction:column;gap:6px;width:min(92%,480px);pointer-events:none}
.toast{background:rgba(23,26,30,.94);border:1px solid var(--teal);border-left:4px solid var(--teal);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;animation:up .2s ease-out}
.toast.warn{border-color:var(--warn)} .toast.bad{border-color:var(--bad)} .toast.ok{border-color:var(--ok)}
body.in-mission #toasts{top:calc(env(safe-area-inset-top,0px) + 130px)}

/* ---------- 3D mission ---------- */
#mission{position:fixed;inset:0;z-index:70;background:linear-gradient(180deg,#4f9fe0 0%,#9ccff0 45%,#f4ecdc 62%,#f4ecdc 100%);overflow:hidden;touch-action:none}
#mission.moab{background:linear-gradient(180deg,#3f8fd8 0%,#9fd6e8 45%,#ffe3c2 62%,#ffe3c2 100%)}
#mission canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-top{position:absolute;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
.m-top>*{pointer-events:auto}
.m-obj{flex:1;min-width:0;background:rgba(23,26,30,.72);border:1px solid rgba(46,196,201,.6);border-radius:8px;padding:6px 10px}
.m-obj b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-obj span{font-size:11px;color:var(--muted)}
.m-gauges{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:11px;font-variant-numeric:tabular-nums}
.m-gauges b{display:inline;font-size:12px;color:var(--teal)}
.m-hull{height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden;margin-top:4px}
.m-hull i{display:block;height:100%;background:var(--ok)}
.m-btn{background:rgba(23,26,30,.72);border:1px solid rgba(201,209,217,.3);border-radius:8px;padding:6px 8px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text)}
#minimap{width:104px;height:104px;border-radius:10px;border:2px solid rgba(201,209,217,.5);background:#000;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.m-cross{position:absolute;left:50%;top:46%;width:46px;height:46px;transform:translate(-50%,-50%);z-index:3;pointer-events:none}
.m-cross::before,.m-cross::after{content:"";position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 3px rgba(0,0,0,.5)}
.m-cross::before{left:50%;top:14px;bottom:14px;width:2px;transform:translateX(-50%)}
.m-cross::after{top:50%;left:14px;right:14px;height:2px;transform:translateY(-50%)}

function roomRate(k){
  const def=ROOMS[S.rooms[k].type]; if(!def.prod) return 0;

}

function personHTML(c,extra){

function flashCoat(id){

// ---------- painted anime backdrop ----------
function cloud(g,cx,cy,s,shade){
  const r=seeded(Math.floor(Math.abs(cx)*7+cy*13)+1);
  const puffs=[];for(let i=0;i<7;i++){const t=i/6;puffs.push([cx+(t-.5)*s*1.9,cy-Math.sin(t*Math.PI)*s*(.45+r()*.25),s*(.28+r()*.22)])}
  puffs.push([cx,cy-s*.15,s*.45]);
  g.fillStyle=shade; puffs.forEach(([x,y,rr])=>{g.beginPath();g.arc(x+s*.04,y+s*.1,rr,0,7);g.fill()});
  g.fillStyle='#ffffff'; puffs.forEach(([x,y,rr])=>{g.beginPath();g.arc(x,y,rr,0,7);g.fill()});
  g.fillStyle=shade; g.globalAlpha=.55; g.beginPath(); g.ellipse(cx,cy+s*.08,s*.95,s*.12,0,0,7); g.fill(); g.globalAlpha=1;
}
function ridge(g,W,base,amp,seed,color,snow){
  const r=seeded(seed);const ph=[r()*6,r()*6,r()*6];const pts=[];
  for(let x=-10;x<=W+10;x+=6){const y=base-amp*(.55+.25*Math.sin(x/W*3.1+ph[0])+.15*Math.sin(x/W*7.3+ph[1])+.08*Math.sin(x/W*17+ph[2]));pts.push([x,y])}
  g.fillStyle=color;g.beginPath();g.moveTo(-10,base+400);pts.forEach(([x,y])=>g.lineTo(x,y));g.lineTo(W+10,base+400);g.fill();
  if(snow){g.fillStyle=snow;g.beginPath();let on=false;
    for(let i=1;i<pts.length-1;i++){const [x,y]=pts[i];if(y<base-amp*.78&&pts[i-1][1]>=y&&pts[i+1][1]>=y){g.moveTo(x-16,y+12);g.quadraticCurveTo(x,y-3,x+16,y+12);g.lineTo(x+8,y+9);g.lineTo(x,y+14);g.lineTo(x-8,y+9);g.closePath();on=true}}
    if(on) g.fill()}
}
function pine(g,x,y,h,dark,lite){
  const w=h*.42;
  for(let i=0;i<4;i++){const ty=y-h*(i*.22),tw=w*(1-i*.2),th=h*.42;
    g.fillStyle=dark;g.beginPath();g.moveTo(x-tw,ty);g.quadraticCurveTo(x-tw*.3,ty-th*.45,x,ty-th);g.quadraticCurveTo(x+tw*.3,ty-th*.45,x+tw,ty);g.quadraticCurveTo(x,ty+th*.12,x-tw,ty);g.fill();
    g.fillStyle=lite;g.beginPath();g.moveTo(x,ty-th);g.quadraticCurveTo(x+tw*.3,ty-th*.45,x+tw,ty);g.quadraticCurveTo(x+tw*.5,ty+th*.05,x+tw*.1,ty+th*.04);g.fill()}
  g.fillStyle='#4a3326';g.fillRect(x-1.5,y,3,h*.12);
}
function bush(g,x,y,s,dark,lite){
  g.fillStyle=dark;[[0,0,1],[-.7,.15,.75],[.7,.15,.75],[0,-.55,.7]].forEach(([dx,dy,k])=>{g.beginPath();g.arc(x+dx*s,y+dy*s,s*k,0,7);g.fill()});
  g.fillStyle=lite;[[.25,-.55,.4],[.75,0,.35]].forEach(([dx,dy,k])=>{g.beginPath();g.arc(x+dx*s,y+dy*s,s*k,0,7);g.fill()});
}
function mesa(g,x0,x1,top,base,c1,c2,c3){
  const w=x1-x0;
  g.fillStyle=c1;g.beginPath();g.moveTo(x0,base);g.lineTo(x0+w*.08,top+6);g.quadraticCurveTo(x0+w*.12,top,x0+w*.2,top);g.lineTo(x1-w*.18,top);g.quadraticCurveTo(x1-w*.1,top,x1-w*.07,top+8);g.lineTo(x1,base);g.fill();
  g.strokeStyle=c2;g.lineWidth=3;for(let y=top+12;y<base;y+=11){g.beginPath();g.moveTo(x0+w*.06,y);g.lineTo(x1-w*.05,y+2);g.stroke()}
  g.fillStyle=c3;g.beginPath();g.moveTo(x1-w*.35,top);g.lineTo(x1-w*.18,top);g.quadraticCurveTo(x1-w*.1,top,x1-w*.07,top+8);g.lineTo(x1,base);g.lineTo(x1-w*.3,base);g.fill();
}
function paintWorld(){
  const w=$('#world'),cv=$('#bg'),surf=$('#surface'); if(!cv||!surf) return;
  const W=w.clientWidth,H=w.scrollHeight,gy=surf.offsetTop+surf.offsetHeight-24;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  const r=seeded(42);const desert=biome()==='desert';
  const sk=g.createLinearGradient(0,0,0,gy);
  if(desert){sk.addColorStop(0,'#3f8fd8');sk.addColorStop(.55,'#9fd6e8');sk.addColorStop(1,'#ffe3c2')}
  else{sk.addColorStop(0,'#4a9be0');sk.addColorStop(.55,'#a5d8f2');sk.addColorStop(1,'#f6efdf')}
  g.fillStyle=sk;g.fillRect(0,0,W,gy);
  const sun=g.createRadialGradient(W*.82,gy*.18,4,W*.82,gy*.18,gy*.5);sun.addColorStop(0,'rgba(255,250,220,.95)');sun.addColorStop(.08,'rgba(255,245,210,.6)');sun.addColorStop(1,'rgba(255,240,200,0)');
  g.fillStyle=sun;g.fillRect(0,0,W,gy);
  const nC=Math.max(3,Math.round(gy/130));
  for(let i=0;i<nC;i++){cloud(g,r()*W,40+r()*Math.max(10,gy-170),40+r()*50,desert?'#e9d2c4':'#cfdcef')}
  if(desert){
    ridge(g,W,gy-44,70,7,'#e8b6a0');
    mesa(g,W*.52,W*1.05,gy-112,gy,'#d9774a','#c2643b','#b65530');
    mesa(g,-W*.08,W*.38,gy-92,gy,'#e08a57','#c9703f','#c0613a');
    g.fillStyle='#c4623a';g.beginPath();g.moveTo(W*.36,gy);g.lineTo(W*.38,gy-70);g.quadraticCurveTo(W*.48,gy-108,W*.58,gy-70);g.lineTo(W*.6,gy);g.lineTo(W*.555,gy);g.lineTo(W*.545,gy-58);g.quadraticCurveTo(W*.48,gy-84,W*.415,gy-58);g.lineTo(W*.405,gy);g.fill();
    g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(W*.38,gy-70);g.quadraticCurveTo(W*.48,gy-108,W*.58,gy-70);g.quadraticCurveTo(W*.48,gy-96,W*.38,gy-70);g.fill();
    for(let i=0;i<10;i++){const x=r()*W;if(Math.abs(x-W/2)<40) continue;bush(g,x,gy-4,5+r()*5,'#5b6b3a','#7f9152')}
    const sand=g.createLinearGradient(0,gy,0,gy+24);sand.addColorStop(0,'#f0b97c');sand.addColorStop(1,'#d9925a');g.fillStyle=sand;g.fillRect(0,gy,W,24);
    g.fillStyle='rgba(120,60,30,.35)';for(let i=0;i<40;i++){g.beginPath();g.ellipse(r()*W,gy+4+r()*18,1.5+r()*2,1+r(),0,0,7);g.fill()}
  } else {
    ridge(g,W,gy-58,110,3,'#b4c3df','#ffffff');
    ridge(g,W,gy-40,80,11,'#8fb0c8','#f4f8ff');
    const lk=g.createLinearGradient(0,gy-42,0,gy-24);lk.addColorStop(0,'#5fb4dc');lk.addColorStop(1,'#2f86bf');g.fillStyle=lk;g.fillRect(0,gy-42,W,20);
    g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1.4;for(let i=0;i<14;i++){const x=r()*W,y=gy-40+r()*16;g.beginPath();g.moveTo(x,y);g.lineTo(x+6+r()*10,y);g.stroke()}
    ridge(g,W,gy-18,34,21,'#3f7a5a');
    for(let i=0;i<26;i++){const x=r()*W;const h=26+r()*34;pine(g,x,gy-6-r()*14,h*.8,'#2f5d45','#4f8a5f')}
    for(let i=0;i<18;i++){const x=r()*W;if(Math.abs(x-W/2)<34) continue;const h=34+r()*36;pine(g,x,gy+2,h,'#24503b','#3f7d52')}
    for(let i=0;i<6;i++){const x=r()*W;if(Math.abs(x-W/2)<40) continue;bush(g,x,gy-2,7+r()*5,'#4f8a4a','#79b65e')}
    const gr=g.createLinearGradient(0,gy,0,gy+24);gr.addColorStop(0,'#8fcf6a');gr.addColorStop(1,'#5a9a4a');g.fillStyle=gr;g.fillRect(0,gy,W,24);
    for(let i=0;i<60;i++){const x=r()*W,y=gy+3+r()*18;g.strokeStyle='rgba(40,90,40,.6)';g.lineWidth=1;g.beginPath();g.moveTo(x,y+4);g.lineTo(x+1.5,y);g.stroke()}
    const fl=['#ffffff','#ffe27a','#ffb3c7'];for(let i=0;i<22;i++){g.fillStyle=fl[i%3];g.beginPath();g.arc(r()*W,gy+4+r()*16,1.6,0,7);g.fill()}
  }
  const top=gy+24;
  const soil=g.createLinearGradient(0,top,0,H);
  if(desert){soil.addColorStop(0,'#a8532f');soil.addColorStop(1,'#4f2414')}else{soil.addColorStop(0,'#6b4f3a');soil.addColorStop(1,'#2d211a')}
  g.fillStyle=soil;g.fillRect(0,top,W,H-top);
  g.strokeStyle=desert?'rgba(255,190,140,.12)':'rgba(255,220,180,.08)';g.lineWidth=6;
  for(let y=top+30;y<H;y+=46){g.beginPath();g.moveTo(0,y);for(let x=0;x<=W;x+=20) g.lineTo(x,y+Math.sin(x/40+y)*5);g.stroke()}
  for(let i=0;i<Math.round(H/14);i++){const x=r()*W,y=top+10+r()*(H-top-10),s=3+r()*7;g.fillStyle=desert?'rgba(230,160,110,.35)':'rgba(160,150,140,.35)';g.beginPath();g.ellipse(x,y,s,s*.7,r(),0,7);g.fill();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.ellipse(x-s*.3,y-s*.3,s*.4,s*.25,0,0,7);g.fill()}
  if(!desert){g.strokeStyle='rgba(90,60,40,.8)';g.lineWidth=2;for(let i=0;i<10;i++){let x=r()*W,y=top;g.beginPath();g.moveTo(x,y);for(let k=0;k<5;k++){x+=(r()-.5)*16;y+=8+r()*8;g.lineTo(x,y)}g.stroke()}}
}

// ---------- world rendering ----------
function roomHTML(k){
  const r=S.rooms[k],def=ROOMS[r.type];
  let inner=`<span class="lamp"></span><span class="rh">${esc(def.short)}</span><span class="rb" data-badge="${k}"></span>${def.prop?`<span class="prop">${def.prop}</span>`:''}<span class="flr"></span>`;
  if(r.type==='hangar'){
    const idx=roomsOf('hangar').indexOf(k);
    const vs=S.vehicles.slice(idx*4,idx*4+4).map(id=>{const v=VEH.find(x=>x.id===id);return v?`<span style="${v.f?'filter:'+v.f:''}">${v.e}</span>`:''}).join('');
    inner+=`<span class="park">${vs}</span>`;
  }
  inner+=crewIn(k).map(c=>personHTML(c)).join('');
  if(r.type==='cell'){
    const idx=roomsOf('cell').indexOf(k);
    inner+=S.jail.slice(idx*2,idx*2+2).map(p=>personHTML(p,'jailed')).join('')+'<span class="bars"></span>';
  }
  return `<button class="slot room ${r.type}" data-room="${k}" aria-label="${esc(def.name)}">${inner}</button>`;
}
function floorHTML(f){
  let h=`<div class="floor"><div class="shaft">${floorName(f)}</div>`;
  for(let s=0;s<3;s++){
    const k=f+':'+s;
    h+=S.rooms[k]?roomHTML(k):`<button class="slot slot-empty" data-empty="${k}">+ BUILD</button>`;
  }
  return h+'</div>';
}
function turretHTML(i){
  const t=S.turrets[i],x=PAD_X[i]*100;
  if(!t) return `<button class="tpad empty" data-pad="${i}" style="left:${x}%" aria-label="Build turret"></button>`;
  const a=i<2?'195deg':'-15deg';
  return `<button class="tpad tur ${t.type}" data-pad="${i}" style="left:${x}%;--a:${a}" aria-label="${TURRETS[t.type].name}"><i class="barrel"></i><i class="dome"></i><i class="base"></i><span class="stars">${'★'.repeat(t.lvl)}</span></button>`;
}
function expandCost(){return 150+100*Math.max(0,S.up+S.down-3)}
function renderWorld(){
  const w=$('#world');
  let h=`<canvas id="bg"></canvas><div class="layer sky pad-x">`;
  h+=S.up<5?`<div class="expand"><button data-expand="up">▲ BUILD UP · ${expandCost()} credits</button></div>`:'<div style="height:16px"></div>';
  h+='<div class="tower">';
  for(let f=S.up;f>=1;f--) h+=floorHTML(f);
  h+=`</div></div><div class="layer surface" id="surface">
    <div class="sign">${esc(FACTIONS[S.faction].place.toUpperCase())}</div><div class="door"></div>
    <div class="lobby">${S.crew.filter(c=>!c.room).map(c=>personHTML(c)).join('')}</div>
    ${[0,1,2,3].map(turretHTML).join('')}<div id="enemies"></div><canvas id="fx"></canvas><div id="shieldbox"></div></div>`;
  h+=`<div class="layer under pad-x"><div class="bunker">`;
  for(let f=-1;f>=-S.down;f--) h+=floorHTML(f);
  h+='</div>';
  h+=S.down<5?`<div class="expand"><button data-expand="down">▼ DIG DOWN · ${expandCost()} credits</button></div>`:'<div style="height:16px"></div>';
  h+='</div>';
  w.innerHTML=h;
  if(B){const box=$('#enemies');B.enemies.forEach(e=>{if(e.el)box.appendChild(e.el)});renderShield()}
  S.crew.forEach(c=>{if(c.flashUntil&&c.flashUntil>Date.now()) flashCoat(c.id)});
  paintWorld();
  updateHUD();
}
let lastW=0;
window.addEventListener('resize',()=>{const w=$('#world');if(S&&w&&w.clientWidth!==lastW){lastW=w.clientWidth;paintWorld()}});
function scrollToSurface(smooth){
  const s=$('#surface'),wrap=$('#wrap'); if(!s) return;
  wrap.scrollTo({top:s.offsetTop-wrap.clientHeight/2+s.offsetHeight/2,behavior:smooth?'smooth':'auto'});
}

// ---------- HUD ----------
function setBar(id,v,max){const el=$(id);const p=clamp(v/max,0,1);el.style.width=(p*100)+'%';el.className=p<.15?'bad':p<.35?'warn':''}
function updateHUD(){
  if(!S) return;
  $('#h-lv').textContent='LV '+level();
  $('#h-place').textContent=S.cmd.name+' · '+FACTIONS[S.faction].place;
  $('#h-cr').textContent=fmt(S.res.credits);
  $('#h-food').textContent=fmt(S.res.food); setBar('#hb-food',S.res.food,foodMax());
  $('#h-pow').textContent=fmt(S.res.power); setBar('#hb-pow',S.res.power,powMax());
  $('#h-tech').textContent=fmt(S.res.tech);
  $('#h-ap').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<S.res.ap?'on':''}"></i>`).join('');
  $('#n-crew').textContent=S.crew.length+'/'+crewCap();
  $('#n-veh').textContent=S.vehicles.length+' of '+VEH.length;
  $('#b-battle').disabled=!!B;
  document.querySelectorAll('[data-badge]').forEach(el=>{
    const k=el.dataset.badge,r=S.rooms[k]; if(!r) return; const def=ROOMS[r.type],n=crewIn(k).length;
    let t='';
    if(def.prod){const rate=roomRate(k);t=n?`+${rate.toFixed(1)} ${def.prod}/s`:'no crew';el.classList.toggle('low',!n||(def.prod!=='power'&&S.res.power<=0))}
    else if(r.type==='hangar') t=n?'pilot ready':'no pilot';
    else if(def.train) t=n?`training ${def.train==='str'?'Strength':'Aim'}`:'no crew';
    else if(def.beds) t=`${def.beds} beds`;
    else if(def.heal) t=n?'healing':'no medic';
    else if(def.jail!==undefined) t='prisoners';

// ---------- speech ----------
function stretch(word){
  const m=word.match(/^([^A-Za-z]*)([A-Za-z']+)([^A-Za-z]*)$/); if(!m) return word+'ooo';
  let w=m[2].replace(/[aeiouAEIOU]/g,v=>v+v.toLowerCase().repeat(ri(1,2)));
  if(w===m[2]) w=w+'aaa';
  w=w.replace(/^([^aeiouAEIOU]+)/,(s)=>s+pick(['oo','ee','aa','uu']));
  return m[1]+w+m[3];
}
function garble(line){
  const ws=line.split(' '); const i=Math.random()<.5?0:ws.length-1; ws[i]=stretch(ws[i]); return ws.join(' ');
}
function sayLine(c){
  pokes[c.id]=(pokes[c.id]||0)+1;
  let line;
  if(c.hurt>0) line=pick(LINES.hurt);
  else if(pokes[c.id]>=4&&!c.isCmd){line=pick(LINES.poke);pokes[c.id]=0;c.mood=clamp(c.mood-3,0,100)}
  else if(!c.room) line=pick(LINES.lobby);
  else if(Math.random()<.35) line=pick(LINES.room[S.rooms[c.room].type]||LINES.ok);
  else line=pick(c.mood>66?LINES.happy:c.mood>35?LINES.ok:LINES.sad);
  return c.clone?garble(line):line;
}

  }

}
const TALK=[
  {q:'Whyyy should I staaay heeere?',a:[['We have the best food in the West.',1],['Because I said so!',0],['Here you could be anything. Even a pilot.',2]]},
  {q:'Yooou would truuust me?',a:[['Everyone deserves a second chance.',2],['Not really, but let\'s try.',1],['Nope.',0]]}
];
function talkStep(c,step,score,fromJail){
  if(step>=TALK.length){
    const ok=score>=3;
    if(fromJail){
      if(ok){S.jail=S.jail.filter(p=>p.id!==c.id);c.clone=false;c.exClone=true;c.smarts+=2;c.room=null;c.mood=80;c.joined=S.t;S.crew.push(c);toast(c.name+' joined your crew!','ok')}
      else toast(c.name+' does not trust you yet. Try again later.','warn');
    } else {
      if(ok){c.clone=false;c.exClone=true;c.smarts+=2;c.mood=80;toast(c.name+' joined your crew for real! +2 Smarts','ok')}
      else {S.crew=S.crew.filter(x=>x.id!==c.id);toast(c.name+' said no and ran out the door.','warn')}
    }
    closeSheet(); renderWorld(); save(); return;
  }
  const t=TALK[step];
  openSheet('Talking to '+esc(c.name),`<div class="cmd-row"><div class="portrait">${personHTML(Object.assign({},c,{hurt:0}))}</div><div class="bubble" style="flex:1">${esc(t.q)}</div></div>
    <div class="list">${t.a.map(([txt,pts])=>`<button class="li" data-act="talk-ans" data-id="${c.id}" data-step="${step}" data-score="${score+pts}" data-jail="${fromJail?1:0}"><span class="grow"><b>${esc(txt)}</b></span></button>`).join('')}</div>`,!fromJail);
}
function resolveClone(id,how){
  const c=S.crew.find(x=>x.id===id); if(!c) return;
  if(how==='exile'){S.crew=S.crew.filter(x=>x.id!==id);toast(c.name+' was exiled. Bye!','ok')}
  else if(how==='jail'){S.crew=S.crew.filter(x=>x.id!==id);c.room=null;S.jail.push(c);toast(c.name+' is in the Holding Cell.','ok')}
  else if(how==='cure'){S.res.tech-=30;c.clone=false;c.exClone=true;c.mood=85;toast('The antidote worked! '+c.name+' is a real crew member now.','ok')}
  else if(how==='talk'){talkStep(c,0,0,false);return}
  closeSheet(); renderWorld(); save();
}

function startBattle(wave,paid){

  closeSheet(); scrollToSurface(true);
  const W=$('#surface').clientWidth,lv=level();
  B={W,shield:100,enemies:[],tracers:[],last:performance.now(),cds:[0,0,0,0],dcd:0,over:false};
  wave.forEach((d,i)=>{
    const left=i%2===0;
    B.enemies.push({d,hp:d.hp*(1+.25*(lv-1)),max:d.hp*(1+.25*(lv-1)),x:left?-30:W+30,dir:left?1:-1,spawn:i*1.1,slow:0,state:'wait',el:null});
  });

function renderShield(){
  const box=$('#shieldbox'); if(!box) return;
  box.innerHTML=B?`<div class="shield"><div class="label">Base shield</div><div class="bar"><i style="width:${B.shield}%" class="${B.shield<25?'bad':B.shield<50?'warn':''}"></i></div></div>`:'';
}
function battleLoop(now){
  if(!B||B.over) return;
  const dt=Math.min(.05,(now-B.last)/1000); B.last=now; B.time=(B.time||0)+dt;
  const surf=$('#surface'); if(!surf){requestAnimationFrame(battleLoop);return}
  const W=surf.clientWidth,H=surf.clientHeight,door=W/2; B.W=W;
  const box=$('#enemies');
  const powF=S.res.power>0?1:.5;
  for(const e of B.enemies){
    if(e.state==='wait'){ if(B.time>=e.spawn){e.state='go';e.el=document.createElement('div');e.el.className='enemy'+(e.dir>0?' flip':'')+(e.d.big?' big':'');e.el.innerHTML=`<span class="em">${e.d.e}</span><span class="hpb"><i></i></span>`;box.appendChild(e.el)} else continue; }
    if(e.state==='go'){
      const sp=e.d.speed*(e.slow>0?.4:1); e.slow=Math.max(0,e.slow-dt);
      if(Math.abs(e.x-door)>30) e.x+=e.dir*sp*dt; else { B.shield-=e.d.dmg*dt; }
    } else if(e.state==='ko'){ e.koT-=dt; if(e.koT<=0){e.state='flee';e.el.classList.toggle('flip')} }
    else if(e.state==='flee'){ e.x-=e.dir*140*dt; if(e.x<-60||e.x>W+60){e.state='gone';e.el.remove()} }
    if(e.el&&e.state!=='gone'){ e.el.style.left=e.x+'px'; const bar=e.el.querySelector('.hpb i'); if(bar) bar.style.width=clamp(e.hp/e.max,0,1)*100+'%'; }

    if(def.prod) r[def.prod]+=roomRate(k);
    for(const c of crewIn(k)){
      if(c.hurt) continue;
      c.xp+=.5;
      if(def.train) c[def.train]=Math.min(10,c[def.train]+.03);
    }
  }
  r.food-=.12*S.crew.length; r.power-=.08*Object.keys(S.rooms).length;
  r.food=clamp(r.food,0,foodMax()); r.power=clamp(r.power,0,powMax());
  const medOn=roomsOf('med').some(k=>crewIn(k).some(c=>!c.hurt));
  for(const c of S.crew){
    const target=r.food<=0?20:r.power<=0?45:(c.room?78:60);
    c.mood+=(target-c.mood)*.02;
    if(c.hurt>0){c.hurt=Math.max(0,c.hurt-(medOn?4:1)); if(!c.hurt&&!M) renderWorldSoon()}
  }
  if(S.t%30===0&&r.ap<5) r.ap++;
  if(!M){
    if(r.food<=0) advise('food','The crew is hungry! Put someone in the Food Hall.','bad');
    else if(r.food<foodMax()*.15) advise('foodlow','Food is getting low.');
    if(r.power<=0) advise('pow','Power is out! Turrets are slow and rooms work at half speed.','bad');
    for(const c of S.crew){
      if(!c.clone||S.t-c.joined<25||S.t-(c.lastSab||0)<30) continue;
      c.lastSab=S.t; if(Math.random()<.5) continue;
      const where=c.room?ROOMS[S.rooms[c.room].type].name:'the lobby';
      const kind=ri(0,2);
      if(kind===0){const n=Math.min(60,Math.floor(r.credits*.1));r.credits-=n;toast(`Hmm... ${n} credits went missing near ${where}.`,'warn')}
      else if(kind===1){r.food=Math.max(0,r.food-15);toast(`Somebody licked all the food in ${where}. Gross. And suspicious.`,'warn')}
      else {r.power=Math.max(0,r.power-15);toast(`The power flickered near ${where}. Weird...`,'warn')}
    }
    if(S.t>=S.nextArrival){ arrival(S.arrivals===1); S.nextArrival=S.t+ri(40,65) }
    if(S.t>=S.nextRaid&&!B){ S.nextRaid=S.t+999; toast('Radar: the Badlands Gang is coming! Battle in 5 seconds.','bad'); setTimeout(()=>{if(!B&&!M) startBattle(makeWave(),false); else S.nextRaid=S.t+120},5000) }
  }
  updateHUD();
  if(S.t%5===0) save();
}
let rwTimer=null; function renderWorldSoon(){ clearTimeout(rwTimer); rwTimer=setTimeout(renderWorld,50) }

// ---------- input ----------
$('#world').addEventListener('click',e=>{
  const p=e.target.closest('.person'); if(p&&!p.classList.contains('jailed')){crewCard(+p.dataset.cid);return}
  const room=e.target.closest('[data-room]'); if(room){roomSheet(room.dataset.room);return}
  const emp=e.target.closest('[data-empty]'); if(emp){buildSheet(emp.dataset.empty);return}
  const pad=e.target.closest('[data-pad]'); if(pad){if(B) return; turretSheet(+pad.dataset.pad);return}
  const ex=e.target.closest('[data-expand]'); if(ex){
    const cost=expandCost(); if(S.res.credits<cost){toast(`You need ${cost} credits to expand.`,'warn');return}
    S.res.credits-=cost; if(ex.dataset.expand==='up') S.up++; else S.down++; S.xp+=10; renderWorld(); save();
    toast(ex.dataset.expand==='up'?'New floor built up into the sky!':'Dug a new floor deeper underground!','ok');
  }
});
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const a=b.dataset.act,id=+b.dataset.id;
  if(a==='card') crewCard(id);
  else if(a==='talk') crewCard(id);
  else if(a==='assign') assignSheet(id);
  else if(a==='rename') renameSheet(id);
  else if(a==='rename-save'){const c=S.crew.find(x=>x.id===id);const v=$('#rn').value.trim();if(v){c.name=v.slice(0,18);if(c.isCmd)S.cmd.name=c.name}renderWorld();save();crewCard(id,'Nice. I like my new name!')}
  else if(a==='assign-to'){const c=S.crew.find(x=>x.id===id);const k=b.dataset.k||null;if(k&&crewIn(k).length>=ROOMS[S.rooms[k].type].cap)return;c.room=k;renderWorld();save();toast(`${c.name} now works ${k?'in the '+ROOMS[S.rooms[k].type].name:'nowhere (lobby)'}.`);closeSheet()}
  else if(a==='identify') identify(id);
  else if(a==='clone') resolveClone(id,b.dataset.how);
  else if(a==='talk-ans'){const fromJail=b.dataset.jail==='1';const c=fromJail?S.jail.find(x=>x.id===id):S.crew.find(x=>x.id===id);talkStep(c,+b.dataset.step+1,+b.dataset.score,fromJail)}
  else if(a==='prisoner'){const p=S.jail.find(x=>x.id===id);if(p) talkStep(p,0,0,true)}
  else if(a==='build'){const t=b.dataset.t,d=ROOMS[t];if(S.res.credits<d.cost)return;S.res.credits-=d.cost;S.rooms[b.dataset.k]={type:t};S.xp+=10;closeSheet();renderWorld();save();toast(`${d.name} built! Tap it to add crew.`,'ok')}
  else if(a==='turret'){const d=TURRETS[b.dataset.t];S.res.credits-=d.cost;if(d.tech)S.res.tech-=d.tech;S.turrets[+b.dataset.i]={type:b.dataset.t,lvl:1};closeSheet();renderWorld();save();toast(d.name+' ready!','ok')}
  else if(a==='upgrade'){const t=S.turrets[+b.dataset.i],cost=TURRETS[t.type].cost*t.lvl;if(S.res.credits<cost)return;S.res.credits-=cost;t.lvl++;renderWorld();save();turretSheet(+b.dataset.i)}
  else if(a==='hangar') hangarSheet();
  else if(a==='htab'){hangarTab=b.dataset.t;hangarSheet()}
  else if(a==='buy'){const v=VEH.find(x=>x.id===b.dataset.v);S.res.credits-=v.cost;if(v.tech)S.res.tech-=v.tech;S.vehicles.push(v.id);renderWorld();save();toast(v.name+' added to your Hangar!','ok');hangarSheet()}
  else if(a==='launch') missionSheet(b.dataset.v);
  else if(a==='go') startMission(b.dataset.v);
  else if(a==='m-resume'){closeSheet();if(M){M.paused=false;M.last=performance.now()}}
  else if(a==='m-quit'){closeSheet();closeMission();renderWorld()}
  else if(a==='fight'&&pendingWave){startBattle(pendingWave,true);pendingWave=null}
  else if(a==='reset-yes'){try{localStorage.removeItem(KEY)}catch(err){} location.reload()}
  else if(a==='reset'){openSheet('Start over?',`<div class="muted">This erases your base, crew and hangar on this device.</div><div class="row"><button class="btn" data-close>KEEP PLAYING</button><button class="btn danger" data-act="reset-yes">ERASE AND RESTART</button></div>`)}
});
$('#b-crew').onclick=crewList;
$('#b-hangar').onclick=hangarSheet;
$('#b-battle').onclick=battlePreview;
$('#b-recruit').onclick=()=>{ if(S.res.credits<60){toast('Recruiting costs 60 credits.','warn');return} if(S.crew.length>=crewCap()){toast('No beds left! Build Sleeping Quarters first.','warn');return} S.res.credits-=60; arrival(false) };
$('#b-gear').onclick=()=>openSheet('Settings',`<div class="muted">Commander ${esc(S.cmd.name)} · ${esc(FACTIONS[S.faction].name)} · Battles won: ${S.wins} · Clones caught: ${S.caught} · Outposts found: ${Object.keys(S.found||{}).length}</div>
  <div class="muted" style="font-size:12px">BASED prototype v0.2. Your game saves on this device automatically.</div><button class="btn danger" data-act="reset">START A NEW BASE</button>`);

// ---------- setup screen ----------
function renderSetup(){
  const sw=(id,list,key)=>{$(id).innerHTML=list.map(c=>`<button class="sw ${setupCfg[key]===c?'on':''}" style="background:${c}" data-k="${key}" data-c="${c}" aria-label="${key} ${c}"></button>`).join('')};
  sw('#sw-skin',SKINS,'skin'); sw('#sw-hair',HAIRS,'hair'); sw('#sw-suit',SUITS,'suit');
  $('#sw-hs').innerHTML=['Bob','Spiky','Ponytail','Swept'].map((n,i)=>`<button class="btn ${setupCfg.hs===i?'primary':''}" style="padding:6px 10px;font-size:12px" data-hs="${i}">${n}</button>`).join('');
  $('#cmd-preview').innerHTML=personHTML({id:-1,skin:setupCfg.skin,hair:setupCfg.hair,shirt:setupCfg.suit,hs:setupCfg.hs,eye:EYES[0],isCmd:true});
  $('#factions').innerHTML=Object.keys(FACTIONS).map(k=>{const f=FACTIONS[k];return `<button class="fac ${setupCfg.faction===k?'on':''} ${f.locked?'locked':''}" data-f="${k}" ${f.locked?'aria-disabled="true"':''}><span class="biome">${f.icon}</span><b>${esc(f.name)}</b><span>${esc(f.place)}</span><span>${esc(f.blurb)}</span></button>`}).join('');
}
$('#setup').addEventListener('click',e=>{
  const s=e.target.closest('.sw'); if(s){setupCfg[s.dataset.k]=s.dataset.c;renderSetup();return}
  const h=e.target.closest('[data-hs]'); if(h){setupCfg.hs=+h.dataset.hs;renderSetup();return}
  const f=e.target.closest('.fac'); if(f){ if(FACTIONS[f.dataset.f].locked){toast(FACTIONS[f.dataset.f].name+' unlocks later in the game!');return} setupCfg.faction=f.dataset.f;renderSetup() }
});
$('#found').onclick=()=>{
  const name=($('#cmd-name').value.trim()||'Commander Ace').slice(0,18);
  newGame(Object.assign({name},setupCfg)); save(); startGame(true);
};

function startGame(fresh){
  $('#setup').hidden=true; $('#game').hidden=false;
  S.found=S.found||{};
  renderWorld(); lastW=$('#world').clientWidth; requestAnimationFrame(()=>{paintWorld();scrollToSurface(false)});
  if(fresh){ toast(`Welcome, ${S.cmd.name}! Tap rooms, crew, and the + spots to build.`,'ok'); setTimeout(()=>toast('Open the Hangar and tap LAUNCH to fly over the real map!'),4000) }
  setInterval(tick,1000);
}

const saved=load();
if(saved&&saved.v===1){S=saved; startGame(false)}
else { $('#setup').hidden=false; renderSetup(); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save() });
})();
</script>
